<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProvaShow Malu — Telão</title>
    <meta name="description" content="A tela da aula ao vivo, para o projetor ou a TV.">
    <meta name="robots" content="noindex">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%234c2a85'/%3E%3Crect x='18' y='18' width='29' height='29' rx='7' fill='%23e4572e'/%3E%3Crect x='53' y='18' width='29' height='29' rx='7' fill='%232e86de'/%3E%3Crect x='18' y='53' width='29' height='29' rx='7' fill='%2317a589'/%3E%3Crect x='53' y='53' width='29' height='29' rx='7' fill='%23f5a623'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="../estilo.css">
    <link rel="stylesheet" href="telao.css">
</head>
<body>

<section class="espera" id="espera">
    <div class="marca"><span class="marca-icone" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span>ProvaShow <small>Malu</small></span></div>
    <h1 id="espera-titulo">Telão</h1>
    <p id="espera-texto">Digite o código da aula ao vivo (aparece no app do professor).</p>
    <form id="form-codigo" autocomplete="off">
        <input type="text" id="campo-codigo" maxlength="7" placeholder="ABC123" aria-label="Código da aula" required>
        <button class="btn btn-principal" type="submit">Abrir</button>
    </form>
</section>

<main class="palco" id="palco" hidden>
    <header class="palco-topo">
        <div class="marca"><span class="marca-icone" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span id="t-turma"></span></div>
        <div class="progresso" id="t-progresso"></div>
        <div class="responderam"><strong id="t-n">0</strong><span id="t-de">de 0</span></div>
    </header>
    <section class="palco-questao">
        <h1 id="t-enunciado"></h1>
        <img id="t-imagem" alt="" hidden>
        <div class="opcoes" id="t-opcoes"></div>
    </section>
    <footer class="palco-chamada" id="t-chamada"></footer>
    <button class="tela-cheia" id="tela-cheia" title="Tela cheia">⛶</button>
</main>

<script src="../vendor/supabase.js"></script>
<script src="../js/config.js"></script>
<script src="../js/canal.js"></script>
<script src="telao.js"></script>
</body>
</html>
