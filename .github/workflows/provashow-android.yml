# Gera o APK do ProvaShow Malu (app nativo Android, via Capacitor) a cada
# mudança em provashow/ — ou à mão, em Actions → "ProvaShow Android" → Run.
# O APK de teste (debug) fica para baixar em "Artifacts" no fim da execução.
name: ProvaShow Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'provashow/**'
      - '.github/workflows/provashow-android.yml'

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: provashow/nativo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # O Android SDK já vem instalado no ubuntu-latest (ANDROID_HOME).
      - name: Conferir o Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms"
      - name: Testes do ProvaShow
        working-directory: provashow
        run: node --test test/provashow.test.cjs
      - name: Instalar o Capacitor
        run: npm install --no-fund --no-audit
      - name: Gerar o projeto Android
        run: npm run android
      - name: Compilar o APK
        working-directory: provashow/nativo/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: provashow-malu-apk
          path: provashow/nativo/android/app/build/outputs/apk/debug/app-debug.apk
