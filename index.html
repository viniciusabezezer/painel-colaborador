<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="6; url=https://malulinks.vercel.app">
    <title>Malu Serviços agora faz parte do MaluLinks - EEMTI Prof. Maria Luiza Saboia</title>
    <meta name="description" content="O Malu Serviços agora faz parte do MaluLinks, o hub da EEMTI Prof. Maria Luiza Saboia Ribeiro.">
    <link rel="canonical" href="https://malulinks.vercel.app">
    <link rel="stylesheet" href="style.css?v=2">
    <style>
        .container { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; }
        header { margin-bottom: 2.2rem; }
        h1 { font-size: clamp(2.4rem, 7vw, 3.8rem); letter-spacing: -2px; line-height: 1.1; }
        .aviso {
            border-radius: var(--radius-lg);
            padding: 2.2rem 2rem;
            text-align: center;
            max-width: 560px;
            margin: 0 auto;
        }
        .aviso p { color: var(--text-muted); font-size: 1.08rem; margin-bottom: 1.6rem; }
        .aviso p strong { color: var(--primary-green); font-weight: 600; }
        .btn-malulinks {
            display: inline-flex;
            align-items: center;
            gap: 0.7rem;
            padding: 1rem 2.2rem;
            border-radius: 100px;
            font-family: inherit;
            font-weight: 700;
            font-size: 1.08rem;
            color: var(--white);
            text-decoration: none;
            background: linear-gradient(110deg, var(--green-vibrant), var(--primary-blue), var(--orange-vibrant));
            background-size: 200% auto;
            box-shadow: 0 14px 30px -10px hsla(var(--h-blue), 78%, 40%, 0.45);
            animation: gradientShift 6s ease infinite;
            transition: var(--transition);
        }
        .btn-malulinks:hover, .btn-malulinks:focus-visible { transform: translateY(-3px) scale(1.03); }
        .contagem { margin-top: 1.4rem; font-size: 0.92rem; color: var(--text-muted); }
        .barra {
            height: 5px;
            border-radius: 100px;
            margin: 0.8rem auto 0;
            max-width: 220px;
            background: hsla(var(--h-blue), 78%, 46%, 0.12);
            overflow: hidden;
        }
        .barra span {
            display: block;
            height: 100%;
            width: 100%;
            transform-origin: left;
            background: linear-gradient(90deg, var(--green-vibrant), var(--primary-blue), var(--orange-vibrant));
            animation: esvaziar 6s linear forwards;
        }
        @keyframes esvaziar { from { transform: scaleX(1); } to { transform: scaleX(0); } }
        @media (max-width: 560px) {
            .container { padding: 2rem 1rem; }
            .school-logo { height: 104px; }
            .aviso { padding: 1.8rem 1.2rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header class="reveal">
            <div class="logo-container">
                <img src="logo.png" alt="Logo EEMTI Maria Luiza Saboia" class="school-logo">
            </div>
            <span class="badge">Novo endereço</span>
            <h1>O Malu Serviços agora faz parte do MaluLinks</h1>
            <div class="title-underline"></div>
        </header>

        <main class="aviso glass reveal delay-2">
            <p>Os formulários, as ocorrências, as cópias, a lista de assinaturas, o InstaPensa e o Identificador de Provas agora estão no <strong>MaluLinks</strong>, organizados por categoria.</p>
            <a class="btn-malulinks" id="abrir-malulinks" href="https://malulinks.vercel.app">
                Abrir o MaluLinks <span aria-hidden="true">&rarr;</span>
            </a>
            <div class="contagem" aria-live="polite">Redirecionando automaticamente em <strong id="segundos">6</strong> <span id="unidade">segundos</span>.</div>
            <div class="barra" aria-hidden="true"><span></span></div>
        </main>
    </div>

    <script>
        (function () {
            var destino = 'https://malulinks.vercel.app';
            var restante = 6;
            var alvo = document.getElementById('segundos');
            var unidade = document.getElementById('unidade');
            var timer = setInterval(function () {
                restante -= 1;
                if (restante <= 0) {
                    clearInterval(timer);
                    window.location.replace(destino);
                    return;
                }
                alvo.textContent = restante;
                unidade.textContent = restante === 1 ? 'segundo' : 'segundos';
            }, 1000);
        })();
    </script>
</body>
</html>
