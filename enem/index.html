<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1c2046">
<title>Partiu ENEM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Partiu ENEM: jogo de tabuleiro e estratégia para treinar todas as regras e cuidados dos dois dias do Enem.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: painel de recursos + tabuleiro em SVG; desafios abrem em cartões no estilo Cartão-Resposta */
:root {
  --noite: #1c2046;
  --noite-2: #282d5c;
  --borda: #3d4384;
  --papel: #fbf6ea;
  --salmao: #e7695d;
  --salmao-claro: #f6cdc6;
  --sol: #ffc83d;
  --tinta: #191c2e;
  --mato: #2a9d8f;
  --erro: #d64545;
  --texto-claro: #eef0ff;
  --texto-suave: #b9bde6;
  --cinza: #5b5f7a;
  --f-display: "Bungee", "Arial Black", Impact, sans-serif;
  --f-corpo: "Atkinson Hyperlegible", "Segoe UI", Roboto, Arial, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  background: var(--noite); color: var(--texto-claro);
  font-family: var(--f-corpo); font-size: 16px;
  -webkit-tap-highlight-color: transparent;
}
#app {
  min-height: 100%; box-sizing: border-box;
  display: flex; flex-direction: column; gap: 10px;
  max-width: 1100px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px 16px;
}
.topo { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.marca { font-family: var(--f-display); font-weight: 400; font-size: 1.35rem; margin: 0; color: var(--sol); line-height: 1; }
.marca span { color: var(--texto-claro); }
.topo .acoes { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.btn-mini {
  font: 700 .85rem var(--f-corpo); color: var(--texto-claro);
  background: var(--noite-2); border: 1px solid var(--borda); border-radius: 999px;
  padding: 7px 13px; cursor: pointer;
}
.btn-mini:hover { border-color: var(--sol); }
button:focus-visible, input:focus-visible { outline: 3px solid var(--sol); outline-offset: 2px; }

/* Painel de recursos */
.hud {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px;
  background: var(--noite-2); border: 1px solid var(--borda); border-radius: 12px; padding: 10px 14px;
}
.hud-fase { flex: 1 1 220px; min-width: 0; }
.hud-fase small { display: block; font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--texto-suave); }
.hud-fase strong { font-family: var(--f-display); font-weight: 400; font-size: 1rem; line-height: 1.2; }
.recurso { display: flex; flex-direction: column; gap: 3px; }
.recurso small { font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; color: var(--texto-suave); }
.coracoes { font-size: 1.15rem; letter-spacing: 3px; color: var(--salmao); line-height: 1; }
.coracoes .vazio { color: #4a4f86; }
.relogio { font: 400 1.25rem var(--f-display); color: var(--sol); font-variant-numeric: tabular-nums; line-height: 1; }
.relogio span { font: 700 .8rem var(--f-corpo); color: var(--texto-suave); }
.barra { width: 150px; height: 7px; border-radius: 4px; background: #14173a; overflow: hidden; }
.barra i { display: block; height: 100%; background: var(--sol); transition: width .4s; }
.barra.perigo i { background: var(--salmao); }
.prof { font: 700 .95rem var(--f-corpo); }
.prof.gasto { color: #6c70a6; text-decoration: line-through; }

/* Tabuleiro */
#tabuleiro { position: relative; display: flex; justify-content: center; }
#tabuleiro svg {
  display: block; width: 100%; height: auto; max-height: calc(100vh - 250px); min-height: 260px;
  border-radius: 14px; box-shadow: 0 0 0 3px #0f1230, 0 14px 40px rgba(0,0,0,.35);
}
.no { cursor: default; }
.no circle.disco { fill: var(--papel); stroke: var(--salmao); stroke-width: 5; }
.no text { pointer-events: none; }
.no.livre { cursor: pointer; }
.no.livre circle.disco { stroke: var(--sol); animation: pulso 1.1s ease-in-out infinite; }
.no.feito circle.disco { fill: var(--tinta); stroke: var(--tinta); }
.no.feito text.icone { fill: var(--papel); }
@keyframes pulso { 0%, 100% { stroke-width: 6; } 50% { stroke-width: 13; } }
#ficha { transition: transform .7s cubic-bezier(.5, 0, .3, 1); }
.dica-tab { margin: 0; text-align: center; color: var(--texto-suave); font-size: .95rem; min-height: 1.4em; }
.escolhas { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.escolha {
  font: 700 .95rem var(--f-corpo); color: var(--tinta); cursor: pointer;
  background: var(--sol); border: 0; border-radius: 10px; padding: 11px 16px; box-shadow: 0 4px 0 #b88a10;
  text-align: left; max-width: 100%;
}
.escolha small { display: block; font-weight: 400; font-size: .8rem; }
.escolha.alt { background: var(--papel); box-shadow: 0 4px 0 #a99f88; }

/* Cartões */
#camada {
  position: fixed; inset: 0; z-index: 20;
  display: flex; align-items: flex-start; justify-content: center;
  overflow-y: auto; background: rgba(15, 17, 44, .74);
  padding: calc(env(safe-area-inset-top, 0px) + 16px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 16px) max(16px, env(safe-area-inset-left, 0px));
  box-sizing: border-box;
}
.cartao {
  position: relative; margin: auto 0; width: 100%; max-width: 660px; box-sizing: border-box;
  background: var(--papel); color: var(--tinta); border-radius: 6px;
  padding: 26px 26px 22px 40px; box-shadow: 0 20px 60px rgba(0,0,0,.45);
  background-image: linear-gradient(90deg, transparent 22px, var(--salmao) 22px, var(--salmao) 24px, transparent 24px);
}
.cartao::before {
  content: ""; position: absolute; top: 0; left: 0; right: 0; height: 8px; border-radius: 6px 6px 0 0;
  background: repeating-linear-gradient(90deg, var(--tinta) 0 10px, transparent 10px 18px); opacity: .85;
}
.olho { font: 700 .74rem var(--f-corpo); letter-spacing: .12em; text-transform: uppercase; color: var(--salmao); margin: 0 0 6px; }
.cartao h2 { font-family: var(--f-display); font-weight: 400; font-size: clamp(1.35rem, 4.4vw, 1.9rem); line-height: 1.1; margin: 0 0 12px; text-wrap: balance; }
.cartao h2.pergunta { font-family: var(--f-corpo); font-weight: 700; font-size: clamp(1.12rem, 3.6vw, 1.42rem); line-height: 1.3; }
.cartao h3 { font-family: var(--f-display); font-weight: 400; font-size: 1rem; margin: 18px 0 8px; letter-spacing: .02em; }
.cartao p { line-height: 1.5; margin: 0 0 10px; }
ul.regras { margin: 0 0 6px; padding: 0; list-style: none; display: grid; gap: 7px; }
ul.regras li { position: relative; padding-left: 26px; line-height: 1.42; }
ul.regras li::before {
  content: ""; position: absolute; left: 2px; top: .28em; width: 13px; height: 13px;
  border-radius: 50%; border: 2px solid var(--salmao); box-sizing: border-box;
}
ul.regras.feitas li::before { background: var(--tinta); border-color: var(--tinta); }
ul.regras.erros li::before { border-color: var(--erro); background: var(--erro); }
.botoes { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
.btn {
  font: 400 1rem var(--f-display); letter-spacing: .03em; cursor: pointer;
  border: 0; border-radius: 10px; padding: 13px 20px;
  background: var(--tinta); color: var(--papel); box-shadow: 0 4px 0 #000;
}
.btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #000; }
.btn.sec { background: transparent; color: var(--tinta); box-shadow: inset 0 0 0 2px var(--tinta); }
.btn.sol { background: var(--sol); color: var(--tinta); box-shadow: 0 4px 0 #b88a10; }
.btn[disabled] { opacity: .4; cursor: not-allowed; }

.recursos-intro { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; margin: 6px 0; }
.recursos-intro div { background: #fff; border: 2px solid #e6dfcc; border-radius: 10px; padding: 9px 11px; line-height: 1.35; font-size: .92rem; }
.recursos-intro b { display: block; font-family: var(--f-display); font-weight: 400; font-size: .85rem; letter-spacing: .02em; }

/* Ferramentas dentro do desafio */
.ferramentas { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 2px; }
.ferr {
  font: 700 .85rem var(--f-corpo); color: var(--tinta); cursor: pointer;
  background: #fff; border: 2px dashed var(--tinta); border-radius: 999px; padding: 7px 12px;
}
.ferr[disabled] { opacity: .4; cursor: not-allowed; }
.caixa-dica { background: #fff7d6; border: 2px solid var(--sol); border-radius: 10px; padding: 10px 12px; margin-top: 10px; }
.caixa-dica ul.regras { font-size: .92rem; }

/* Múltipla escolha */
.opcoes { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 8px; }
.opcao {
  width: 100%; text-align: left; cursor: pointer; display: flex; gap: 12px; align-items: flex-start;
  font: 400 1rem/1.4 var(--f-corpo); color: var(--tinta);
  background: #fff; border: 2px solid #d9d2c0; border-radius: 10px; padding: 10px 12px;
}
.opcao:hover:not([disabled]) { border-color: var(--tinta); }
.bolha {
  flex: none; width: 28px; height: 28px; border-radius: 50%; box-sizing: border-box;
  border: 2px solid var(--salmao); color: var(--salmao);
  display: grid; place-items: center; font: 700 .85rem var(--f-corpo);
}
.opcao.marcada .bolha { background: var(--tinta); border-color: var(--tinta); color: var(--tinta); }
.opcao.certa { border-color: var(--mato); background: #e3f4f1; }
.opcao.errada { border-color: var(--erro); background: #fbe5e3; }
.opcao.eliminada { opacity: .35; text-decoration: line-through; }
.opcao[disabled] { cursor: default; }
.retorno { margin-top: 14px; padding: 12px 14px; border-radius: 10px; line-height: 1.45; }
.retorno.ok { background: #e3f4f1; }
.retorno.nao { background: #fbe5e3; }
.retorno strong { font-family: var(--f-display); font-weight: 400; letter-spacing: .02em; }

/* Classificar */
.linhas { display: grid; gap: 8px; margin-top: 12px; }
.linha { background: #fff; border: 2px solid #d9d2c0; border-radius: 10px; padding: 9px 11px; display: grid; gap: 7px; }
.linha .txt { font-weight: 700; line-height: 1.35; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button {
  flex: 1 1 120px; cursor: pointer; font: 700 .88rem var(--f-corpo); color: var(--tinta);
  background: var(--papel); border: 2px solid #cfc6b0; border-radius: 8px; padding: 7px 8px;
}
.seg button.on { background: var(--tinta); border-color: var(--tinta); color: var(--papel); }
.seg button[disabled] { cursor: default; }
.linha.certa { border-color: var(--mato); background: #eef8f6; }
.linha.errada { border-color: var(--erro); background: #fdf0ee; }
.linha .exp { font-size: .88rem; color: #8a2a24; }
.linha.certa .exp { color: #1d6a60; }

/* Ordenar */
.ordem { list-style: none; counter-reset: k; padding: 0; margin: 12px 0 0; display: grid; gap: 7px; }
.ordem li { counter-increment: k; display: flex; align-items: center; gap: 10px; }
.ordem li::before {
  content: counter(k); flex: none; width: 28px; height: 28px; border-radius: 50%;
  display: grid; place-items: center; font: 700 .85rem var(--f-corpo);
  background: var(--tinta); color: var(--papel);
}
.vaga {
  flex: 1; min-height: 44px; text-align: left; cursor: pointer; box-sizing: border-box;
  font: 700 .95rem/1.3 var(--f-corpo); color: var(--tinta);
  background: #fff; border: 2px dashed #cfc6b0; border-radius: 10px; padding: 9px 11px;
}
.vaga.cheia { border-style: solid; border-color: var(--tinta); }
.vaga.trava { border-color: var(--mato); background: #eef8f6; cursor: default; }
.vaga.errada { border-color: var(--erro); background: #fdf0ee; }
.monte { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.peca {
  cursor: pointer; font: 700 .92rem/1.3 var(--f-corpo); color: var(--tinta); text-align: left;
  background: var(--sol); border: 0; border-radius: 10px; padding: 9px 12px; box-shadow: 0 3px 0 #b88a10; max-width: 100%;
}
.instr { font-size: .9rem; color: var(--cinza); margin: 6px 0 0 !important; }

/* Menu */
.mapa { display: grid; gap: 14px; margin: 16px 0 4px; }
.dia-rotulo { font: 700 .78rem var(--f-corpo); letter-spacing: .1em; text-transform: uppercase; margin: 0 0 6px; color: var(--cinza); }
.fases { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
.fase {
  text-align: left; cursor: pointer; font: 700 .86rem/1.25 var(--f-corpo); color: var(--tinta);
  background: #fff; border: 2px solid var(--tinta); border-radius: 10px; padding: 8px 10px; min-height: 74px;
  display: flex; flex-direction: column; gap: 4px;
}
.fase .n { font-family: var(--f-display); font-weight: 400; font-size: .8rem; color: var(--salmao); }
.fase .estrelas { margin-top: auto; letter-spacing: 2px; font-size: .85rem; color: #c9a227; }
.fase[disabled] { opacity: .45; cursor: not-allowed; border-style: dashed; }
.fase.atual { background: var(--sol); }
.nota-rodape { font-size: .82rem; color: var(--cinza); margin-top: 14px !important; }
.placar { display: flex; gap: 18px; flex-wrap: wrap; margin: 4px 0 6px; }
.placar div { display: flex; flex-direction: column; }
.placar b { font: 400 1.6rem var(--f-display); font-variant-numeric: tabular-nums; }
.placar span { font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; color: var(--cinza); }
.grande-estrela { font-size: 2rem; letter-spacing: 6px; color: #c9a227; margin: 2px 0 8px; }
.evento { font-size: 3rem; line-height: 1; margin: 0 0 8px; }
.revisao section { border-top: 2px dashed var(--salmao-claro); padding-top: 4px; }
.campo { display: grid; gap: 6px; margin: 12px 0; }
.campo label { font-weight: 700; font-size: .9rem; }
.campo input { font: 400 1.05rem var(--f-corpo); padding: 10px 12px; border-radius: 8px; border: 2px solid var(--tinta); background: #fff; color: var(--tinta); }
.certificado { border: 3px double var(--tinta); border-radius: 8px; padding: 16px; margin: 10px 0; text-align: center; background: #fff; }
.certificado .nome { font: 400 clamp(1.2rem, 4vw, 1.7rem) var(--f-display); margin: 6px 0; overflow-wrap: anywhere; }
@media (max-width: 520px) {
  .cartao { padding: 22px 16px 18px 34px; background-image: linear-gradient(90deg, transparent 16px, var(--salmao) 16px, var(--salmao) 18px, transparent 18px); }
  .hud { gap: 8px 16px; }
  .barra { width: 110px; }
}
@media (prefers-reduced-motion: reduce) {
  #ficha, .barra i { transition: none; }
  .no.livre circle.disco { animation: none; stroke-width: 9; }
}
</style>
</head>
<body>


<div id="app">
  <header class="topo">
    <h1 class="marca">Partiu <span>ENEM</span></h1>
    <div class="acoes">
      <button type="button" class="btn-mini" id="b-som" aria-pressed="true">Som: ligado</button>
      <button type="button" class="btn-mini" id="b-revisao">Revisão</button>
      <button type="button" class="btn-mini" id="b-menu">Fases</button>
    </div>
  </header>
  <section class="hud" aria-label="Seus recursos">
    <div class="hud-fase"><small id="h-quando">Dia 1</small><strong id="h-titulo">Mochila pronta</strong></div>
    <div class="recurso"><small>Energia</small><div class="coracoes" id="h-energia" aria-live="polite"></div></div>
    <div class="recurso"><small id="h-limite">Relógio</small><div class="relogio" id="h-relogio">20:00</div><div class="barra" id="h-barra"><i></i></div></div>
    <div class="recurso"><small>Ajuda</small><div class="prof" id="h-prof">🧑‍🏫 Professor 1×</div></div>
  </section>
  <div id="tabuleiro"></div>
  <p class="dica-tab" id="dica-tab" aria-live="polite"></p>
  <div class="escolhas" id="escolhas"></div>
</div>
<div id="camada" hidden><div class="cartao" id="cartao" role="dialog" aria-modal="true" aria-labelledby="cartao-titulo"></div></div>

<script>
(() => {
"use strict";

/* ===================== CONTEÚDO ===================== */
// Cada fase: regras (estudo), perguntas (casas "?"), dois desafios especiais (atalho e portão) e dois eventos.
// Desafio "classificar": itens [texto, índice da coluna certa, explicação]. "ordenar": passos já na ordem certa.
const VF = ["Verdadeiro", "Falso"];
const FASES = [
  {
    dia: 1, quando: "Sábado, véspera do 1º dia", inicio: "20:00", limite: "22:30", rotLimite: "hora de dormir", cena: "noite",
    titulo: "Mochila pronta",
    regras: [
      "Documento oficial ORIGINAL com foto. Digital, só no aplicativo oficial (CNH digital, e-Título, RG digital).",
      "Não valem: cópia (nem autenticada), print ou foto do documento, carteira de estudante.",
      "Caneta esferográfica de tinta preta, de corpo transparente. Leve duas.",
      "Recomendado: Cartão de Confirmação impresso, água e lanche.",
      "Proibidos: relógio, calculadora, boné, óculos escuros, lápis, borracha e corretivo.",
    ],
    perguntas: [
      { q: "Qual destes documentos é aceito para entrar na sala de prova?", o: ["Carteira de estudante", "Cópia autenticada do RG", "CNH digital aberta no aplicativo oficial", "Foto do RG salva no celular"], a: 2, x: "Documento digital vale só aberto no app oficial. Cópias, fotos, prints e carteira de estudante não são aceitos." },
      { q: "Que caneta você deve levar?", o: ["Qualquer caneta azul ou preta", "Esferográfica de tinta preta, de corpo transparente", "Caneta preta com corpo colorido", "Lápis e borracha, para poder corrigir"], a: 1, x: "Tinta preta e corpo transparente. Lápis e borracha são proibidos." },
      { q: "O Cartão de Confirmação da Inscrição é...", o: ["Obrigatório para entrar", "Recomendado: mostra local de prova, número de inscrição e língua escolhida", "Proibido na sala", "Entregue pelo fiscal no dia"], a: 1, x: "Não é obrigatório, mas é muito útil. Ele fica na Página do Participante." },
      { q: "Seu RG foi roubado uma semana antes da prova. O que fazer?", o: ["Ficar em casa: sem documento não tem jeito", "Levar Boletim de Ocorrência de no máximo 90 dias e passar por identificação especial", "Levar a carteira de estudante", "Mostrar uma foto antiga do RG"], a: 1, x: "Com o B.O. emitido há no máximo 90 dias, você faz a prova após a identificação especial." },
      { q: "Onde você confere o seu local de prova?", o: ["No Cartão de Confirmação, na Página do Participante", "No grupo da turma", "Só no dia, na porta da escola", "Não precisa: é sempre na sua escola"], a: 0, x: "O local pode não ser na sua escola. Confira com antecedência e, se der, visite antes." },
    ],
    esp: [
      { tipo: "classificar", titulo: "Arrume a mochila", enun: "Separe o que vai na mochila do Enem e o que fica em casa.", col: ["Levar", "Deixar em casa"], itens: [
        ["RG original", 0, "Documento oficial original com foto: obrigatório."],
        ["Caneta preta de corpo transparente", 0, "É a única caneta permitida."],
        ["Cartão de Confirmação impresso", 0, "Recomendado: tem seu local e número de inscrição."],
        ["Garrafa de água", 0, "Água e lanche são permitidos (podem ser vistoriados)."],
        ["Xerox autenticada do RG", 1, "Cópia não vale, nem autenticada."],
        ["Carteira de estudante", 1, "Não é aceita como documento de identificação."],
        ["Lápis e borracha", 1, "Proibidos: tudo é feito com caneta preta."],
        ["Relógio analógico", 1, "Relógio de qualquer tipo é proibido."],
        ["Boné", 1, "Boné, chapéu, viseira e gorro são proibidos na sala."],
      ] },
      { tipo: "classificar", titulo: "Documento na mão", enun: "Verdadeiro ou falso?", col: VF, itens: [
        ["CNH digital aberta no aplicativo oficial vale como documento.", 0, "Documentos digitais oficiais valem, abertos no app."],
        ["Print do RG no celular vale como documento.", 1, "Print ou foto de documento não é aceito."],
        ["Passaporte válido é aceito.", 0, "Passaporte é documento oficial com foto."],
        ["Com o RG roubado, um B.O. de até 90 dias permite fazer a prova.", 0, "Você passa por identificação especial e faz a prova."],
        ["Caneta preta de corpo colorido é permitida.", 1, "O corpo da caneta precisa ser transparente."],
      ] },
    ],
    eventos: [
      { ic: "🎒", t: "Boa escolha", txt: "Você separou a mochila e a roupa antes do jantar.", f: -.08 },
      { ic: "📱", t: "Imprevisto", txt: "Ficou rolando o feed até tarde. Dormir cedo na véspera ajuda a memória.", f: .1 },
    ],

  ini:  { L: [90, 470],  P: [110, 790], prox: ["q1"], rot: "Início" },
  q1:   { L: [250, 380], P: [320, 700], prox: ["q2"], tipo: "q", rot: "Pergunta" },
  q2:   { L: [420, 455], P: [470, 570], prox: ["a", "b1"], tipo: "q", rot: "Pergunta" },
  a:    { L: [580, 230], P: [170, 420], prox: ["gate"], tipo: "esp", esp: 0, rot: "Atalho: desafio" },
  b1:   { L: [610, 470], P: [500, 410], prox: ["b2"], tipo: "q", rot: "Pergunta" },
  b2:   { L: [780, 420], P: [440, 270], prox: ["gate"], tipo: "q", rot: "Pergunta" },
  gate: { L: [890, 210], P: [250, 140], prox: [], tipo: "esp", esp: 1, rot: "Desafio final" },
};
const ARESTAS = [["ini", "q1"], ["q1", "q2"], ["q2", "a"], ["a", "gate"], ["q2", "b1"], ["b1", "b2"], ["b2", "gate"]];
const CENAS = {
  noite:  { chao: "#252a5e", chao2: "#2d3370", deco: "casa", cor: "#3a4190", luz: "#ffd36b", estrada: "#14173a" },
  manha:  { chao: "#86c27a", chao2: "#7ab86e", deco: "arvore", cor: "#3f8f5a", luz: "#e6f6ff", estrada: "#5d5f6e" },
  escola: { chao: "#d8c49a", chao2: "#cfb98c", deco: "escola", cor: "#e3a948", luz: "#bfe6f5", estrada: "#9b8667" },
  sala:   { chao: "#c8915a", chao2: "#bd8650", deco: "carteira", cor: "#3a6ea5", luz: "#f4e7d0", estrada: "#8a5d36" },
  tarde:  { chao: "#efbb7c", chao2: "#e6ae6c", deco: "arvore", cor: "#5f9a62", luz: "#ffe9b8", estrada: "#8e7660" },
  fim:    { chao: "#3f3678", chao2: "#463d84", deco: "estrela", cor: "#7a6ad0", luz: "#ffd36b", estrada: "#221d4a" },
};
function h(n) { const x = Math.sin(n * 127.1 + 11.7) * 43758.5453; return x - Math.floor(x); }

/* ===================== ESTADO ===================== */
const CHAVE = "partiu-enem-v2";
function ler() {
  try { const s = JSON.parse(localStorage.getItem(CHAVE)); if (s && Array.isArray(s.estrelas)) return s; } catch (e) {}
  return { liberada: 0, estrelas: [], pontos: [], nome: "", som: true };
}
let salvo = ler();
function gravar() { try { localStorage.setItem(CHAVE, JSON.stringify(salvo)); } catch (e) {} }

let S = null;      // estado da fase em andamento
let D = null;      // desafio aberto
let ori = "L";     // orientação do tabuleiro
let modo = "menu"; // menu | tabuleiro | desafio | fim

const minutos = s => { const [a, b] = s.split(":").map(Number); return a * 60 + b; };
const hora = m => String(Math.floor(m / 60) % 24).padStart(2, "0") + ":" + String(Math.round(m) % 60).padStart(2, "0");
const r5 = v => Math.max(5, Math.round(v / 5) * 5);
function custos(F) {
  const W = minutos(F.limite) - minutos(F.inicio);
  return { W, passo: r5(W * .1), erro: r5(W * .17), dica: r5(W * .07) };
}
const embaralhar = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* ===================== SOM ===================== */
let ac = null;
function bip(f, d = .09, tipo = "square", vol = .05) {
  if (!salvo.som) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = tipo; o.frequency.value = f;
    g.gain.setValueAtTime(vol, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + d);
    o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + d);
  } catch (e) {}
}
const somPasso = () => { bip(440, .06, "triangle", .06); setTimeout(() => bip(520, .06, "triangle", .06), 120); };
const somCerto = () => { bip(660, .08); setTimeout(() => bip(990, .08), 80); setTimeout(() => bip(1320, .12), 160); };
const somErro = () => bip(150, .28, "sawtooth", .06);

/* ===================== DESENHO DO TABULEIRO ===================== */
const elTab = document.getElementById("tabuleiro");
function pos(id) { return NOS[id][ori]; }
function curva(a, b) {
  const [x1, y1] = pos(a), [x2, y2] = pos(b);
  const mx = (x1 + x2) / 2, my = (y1 + y2) / 2, dx = x2 - x1, dy = y2 - y1;
  const k = (ARESTAS.findIndex(e => e[0] === a && e[1] === b) % 2 ? 1 : -1) * .18;
  return `M${x1} ${y1} Q${mx - dy * k} ${my + dx * k} ${x2} ${y2}`;
}
function decoracao(c, Wv, Hv) {
  let s = "";
  const longe = (x, y) => Object.keys(NOS).every(id => { const [nx, ny] = pos(id); return Math.hypot(nx - x, ny - y) > 95; });
  for (let i = 0; i < 70; i++) {
    const x = h(i) * Wv, y = h(i + 50) * Hv;
    if (!longe(x, y)) continue;
    const t = .7 + h(i + 9) * .6;
    if (c.deco === "casa") s += `<g transform="translate(${x} ${y}) scale(${t})"><rect x="-22" y="-16" width="44" height="32" rx="3" fill="${c.cor}"/><path d="M-26 -14 L0 -34 L26 -14Z" fill="#4c55b0"/><rect x="-12" y="-6" width="9" height="9" fill="${c.luz}" opacity="${h(i + 3) > .4 ? .9 : .2}"/><rect x="4" y="-6" width="9" height="9" fill="${c.luz}" opacity="${h(i + 4) > .4 ? .9 : .2}"/></g>`;
    else if (c.deco === "arvore") s += `<g transform="translate(${x} ${y}) scale(${t})"><circle r="20" fill="${c.cor}"/><circle cx="-9" cy="-6" r="11" fill="#ffffff" opacity=".12"/></g>`;
    else if (c.deco === "escola") s += h(i + 7) > .5 ? `<g transform="translate(${x} ${y}) scale(${t})"><rect x="-34" y="-20" width="68" height="40" rx="3" fill="${c.cor}"/><rect x="-26" y="-12" width="12" height="10" fill="${c.luz}"/><rect x="-6" y="-12" width="12" height="10" fill="${c.luz}"/><rect x="14" y="-12" width="12" height="10" fill="${c.luz}"/></g>` : `<circle cx="${x}" cy="${y}" r="${16 * t}" fill="#5ea36b"/>`;
    else if (c.deco === "carteira") s += `<g transform="translate(${x} ${y}) scale(${t})"><rect x="-22" y="-14" width="44" height="28" rx="3" fill="#e0c39a"/><rect x="-14" y="-8" width="16" height="11" fill="#fff"/><rect x="-22" y="18" width="44" height="10" rx="3" fill="${c.cor}"/></g>`;
    else s += `<circle cx="${x}" cy="${y}" r="${1.5 + t * 2}" fill="${c.luz}" opacity="${.4 + h(i + 2) * .6}"/>`;
  }
  return s;
}
function desenharTabuleiro() {
  const F = FASES[S ? S.fase : 0], c = CENAS[F.cena];
  ori = elTab.clientWidth < 640 ? "P" : "L";
  const [Wv, Hv] = ori === "L" ? [1000, 560] : [600, 860];
  const R = ori === "L" ? 34 : 40;
  let s = `<svg viewBox="0 0 ${Wv} ${Hv}" role="img" aria-label="Tabuleiro da fase ${esc(F.titulo)}" preserveAspectRatio="xMidYMid meet">
    <defs><pattern id="xadrez" width="80" height="80" patternUnits="userSpaceOnUse"><rect width="80" height="80" fill="${c.chao}"/><rect width="40" height="40" fill="${c.chao2}"/><rect x="40" y="40" width="40" height="40" fill="${c.chao2}"/></pattern></defs>
    <rect width="${Wv}" height="${Hv}" fill="url(#xadrez)"/>${decoracao(c, Wv, Hv)}`;
  for (const [a, b] of ARESTAS) s += `<path d="${curva(a, b)}" fill="none" stroke="${c.estrada}" stroke-width="30" stroke-linecap="round"/>`;
  for (const [a, b] of ARESTAS) s += `<path d="${curva(a, b)}" fill="none" stroke="#fbf6ea" stroke-width="3" stroke-dasharray="12 12" opacity=".7"/>`;
  for (const id of Object.keys(NOS)) {
    const n = NOS[id], [x, y] = pos(id);
    const ic = id === "ini" ? "▶" : n.tipo === "q" ? "?" : "★";
    s += `<g class="no" id="no-${id}" data-no="${id}" tabindex="-1" role="button" aria-label="${esc(n.rot)}">
      <circle class="disco" cx="${x}" cy="${y}" r="${R}"/>
      <text class="icone" x="${x}" y="${y + 12}" text-anchor="middle" font-family="Bungee, sans-serif" font-size="${R * .95}" fill="#191c2e">${ic}</text>
      <rect x="${x - 70}" y="${y + R + 6}" width="140" height="24" rx="8" fill="rgba(25,28,46,.82)"/>
      <text x="${x}" y="${y + R + 23}" text-anchor="middle" font-family="'Atkinson Hyperlegible', sans-serif" font-weight="700" font-size="15" fill="#fff">${esc(n.rot)}</text></g>`;
  }
  const esc2 = ori === "L" ? 1 : 1.15;
  s += `<g id="ficha" style="transform: translate(${pos(S ? S.pos : "ini").join("px,")}px)"><g transform="translate(0 ${-R - 6}) scale(${esc2})">
    <ellipse cx="0" cy="46" rx="18" ry="5" fill="rgba(0,0,0,.25)"/>
    <rect x="-17" y="2" width="12" height="22" rx="4" fill="#e7695d"/>
    <rect x="-10" y="2" width="22" height="26" rx="6" fill="#fff" stroke="#191c2e" stroke-width="2"/>
    <rect x="-10" y="12" width="22" height="4" fill="#2a9d8f"/>
    <rect x="-7" y="28" width="6" height="16" rx="3" fill="#1f3b73"/><rect x="3" y="28" width="6" height="16" rx="3" fill="#1f3b73"/>
    <circle cx="1" cy="-8" r="11" fill="#8d5a3b" stroke="#191c2e" stroke-width="2"/>
    <path d="M-10 -10 A11 11 0 0 1 12 -11 Q2 -14 -10 -6Z" fill="#1b1b1b"/>
    <circle cx="6" cy="-7" r="1.8" fill="#111"/></g></g></svg>`;
  elTab.innerHTML = s;
  atualizarNos();
}
function livres() {
  if (!S || modo !== "tabuleiro") return [];
  if (S.pos !== "ini" && !S.feitos.has(S.pos)) return [];
  return NOS[S.pos].prox;
}
function atualizarNos() {
  const L = livres();
  for (const id of Object.keys(NOS)) {
    const g = document.getElementById("no-" + id); if (!g) continue;
    g.classList.toggle("feito", !!S && (S.feitos.has(id) || id === "ini"));
    g.classList.toggle("livre", L.includes(id));
    g.setAttribute("tabindex", L.includes(id) ? "0" : "-1");
  }
  const fi = document.getElementById("ficha");
  if (fi && S) fi.style.transform = `translate(${pos(S.pos).join("px,")}px)`;
  // escolhas acessíveis abaixo do tabuleiro
  const el = document.getElementById("escolhas"), dica = document.getElementById("dica-tab");
  if (!S || modo !== "tabuleiro") { el.innerHTML = ""; dica.textContent = ""; return; }
  const k = custos(FASES[S.fase]);
  if (L.length === 2) {
    dica.textContent = "Bifurcação! Escolha seu caminho.";
    el.innerHTML = `<button type="button" class="escolha" data-ir="a">Atalho <small>1 desafio mais difícil · economiza ${k.passo} min</small></button>
      <button type="button" class="escolha alt" data-ir="b1">Caminho longo <small>2 perguntas comuns · +${k.passo} min</small></button>`;
  } else if (L.length === 1) {
    dica.textContent = S.pos === "ini" ? "Toque na casa que está piscando para começar a andar." : "Toque na próxima casa para avançar.";
    el.innerHTML = `<button type="button" class="escolha" data-ir="${L[0]}">Avançar para: ${esc(NOS[L[0]].rot)} <small>cada passo custa ${k.passo} min</small></button>`;
  } else { el.innerHTML = ""; dica.textContent = ""; }
}

/* ===================== PAINEL ===================== */
function atualizarHud() {
  const F = FASES[S ? S.fase : 0], k = custos(F);
  document.getElementById("h-quando").textContent = `Dia ${F.dia} · Fase ${(S ? S.fase : 0) + 1} de ${FASES.length}`;
  document.getElementById("h-titulo").textContent = F.titulo;
  const en = S ? S.energia : 3;
  document.getElementById("h-energia").innerHTML = "❤".repeat(en) + `<span class="vazio">${"❤".repeat(Math.max(0, 3 - en))}</span>`;
  document.getElementById("h-energia").setAttribute("aria-label", `${en} de 3 de energia`);
  const gasto = S ? S.gasto : 0;
  document.getElementById("h-relogio").innerHTML = `${hora(minutos(F.inicio) + gasto)} <span>/ ${F.limite}</span>`;
  document.getElementById("h-limite").textContent = `Relógio · ${F.rotLimite} às ${F.limite}`;
  const p = Math.min(1, gasto / k.W), b = document.getElementById("h-barra");
  b.querySelector("i").style.width = (p * 100) + "%"; b.classList.toggle("perigo", p > .75);
  const pr = document.getElementById("h-prof"), tem = !S || S.prof;
  pr.textContent = "🧑‍🏫 Professor " + (tem ? "1×" : "usado"); pr.classList.toggle("gasto", !tem);
}

/* ===================== FLUXO DA FASE ===================== */
function iniciarFase(i) {
  S = { fase: i, energia: 3, gasto: 0, prof: true, pos: "ini", feitos: new Set(), usadas: new Set(), acertos: 0, erros: 0, revisar: [], eventos: embaralhar(FASES[i].eventos.slice()), dicas: 0 };
  modo = "tabuleiro"; fecharCamada();
  desenharTabuleiro(); atualizarHud();
}
function ir(id) {
  if (!livres().includes(id)) return;
  const F = FASES[S.fase], k = custos(F);
  S.pos = id; S.gasto += k.passo; modo = "andando";
  somPasso(); atualizarNos(); atualizarHud();
  setTimeout(() => {
    if (tempoEsgotado()) return;
    const ev = id === "q2" ? S.eventos[0] : id === "b1" ? S.eventos[1] : null;
    if (ev) mostrarEvento(ev, () => abrirDesafio(id)); else abrirDesafio(id);
  }, 750);
}
function tempoEsgotado() {
  const F = FASES[S.fase];
  if (S.gasto > custos(F).W) { falhar("tempo"); return true; }
  return false;
}
function mostrarEvento(ev, depois) {
  const F = FASES[S.fase], W = custos(F).W, m = r5(Math.abs(ev.f) * W) * Math.sign(ev.f);
  S.gasto = Math.max(0, S.gasto + m); atualizarHud();
  modo = "desafio";
  abrirCamada(`<div class="evento" aria-hidden="true">${ev.ic}</div>
    <p class="olho">${esc(ev.t)} · carta do caminho</p>
    <h2 id="cartao-titulo">${m < 0 ? `Ganhou ${-m} minutos` : `Perdeu ${m} minutos`}</h2>
    <p>${esc(ev.txt)}</p>
    <div class="botoes"><button type="button" class="btn" data-acao="evento-ok" data-foco>Continuar</button></div>`);
  eventoDepois = () => { if (!tempoEsgotado()) depois(); };
}
let eventoDepois = null;

function abrirDesafio(id) {
  modo = "desafio";
  const n = NOS[id], F = FASES[S.fase];
  if (n.tipo === "q") {
    let pool = F.perguntas.map((_, i) => i).filter(i => !S.usadas.has(i));
    if (!pool.length) { S.usadas.clear(); pool = F.perguntas.map((_, i) => i); }
    const qi = pool[Math.floor(Math.random() * pool.length)]; S.usadas.add(qi);
    D = { no: id, tipo: "q", P: F.perguntas[qi], elim: [], dica: false, resp: null };
  } else {
    const E = F.esp[n.esp];
    if (E.tipo === "classificar") D = { no: id, tipo: "classificar", E, itens: embaralhar(E.itens.map(([t, c, x]) => ({ t, c, x, sel: null, trava: false, err: false }))), dica: false, fim: false };
    else D = { no: id, tipo: "ordenar", E, monte: embaralhar(E.passos.map((_, i) => i)), seq: E.passos.map(() => null), trava: E.passos.map(() => false), errs: [], dica: false, fim: false };
  }
  renderDesafio();
}
function cabecalho() {
  const n = NOS[D.no], k = custos(FASES[S.fase]);
  const especial = D.tipo !== "q";
  return `<p class="olho">${especial ? (D.no === "gate" ? "Desafio final" : "Atalho · desafio especial") : "Pergunta"} · Fase ${S.fase + 1}</p>`
    + (especial ? `<h2 id="cartao-titulo">${esc(D.E.titulo)}</h2><p>${esc(D.E.enun)}</p>` : `<h2 id="cartao-titulo" class="pergunta">${esc(D.P.q)}</h2>`)
    + `<div class="ferramentas">
        <button type="button" class="ferr" data-acao="dica" ${D.dica || travado() ? "disabled" : ""}>💡 Ver regras (+${k.dica} min)</button>
        <button type="button" class="ferr" data-acao="prof" ${!S.prof || travado() ? "disabled" : ""}>🧑‍🏫 Professor${especial ? ": resolve 2 itens" : ": elimina 2"} ${S.prof ? "(1×)" : "(usado)"}</button>
      </div>`
    + (D.dica ? `<div class="caixa-dica"><ul class="regras">${FASES[S.fase].regras.map(r => `<li>${esc(r)}</li>`).join("")}</ul></div>` : "");
}
function travado() { return D.tipo === "q" ? D.resp !== null : D.fim; }

function renderDesafio() {
  let html = cabecalho();
  if (D.tipo === "q") {
    const P = D.P;
    html += `<ol class="opcoes">${P.o.map((o, k) => {
      let cls = "opcao";
      if (D.elim.includes(k)) cls += " eliminada";
      if (D.resp !== null) { if (k === D.resp) cls += " marcada"; if (k === P.a) cls += " certa"; else if (k === D.resp) cls += " errada"; }
      const dis = D.resp !== null || D.elim.includes(k);
      return `<li><button type="button" class="${cls}" data-op="${k}" ${dis ? "disabled" : ""}><span class="bolha">${"ABCD"[k]}</span><span>${esc(o)}</span></button></li>`;
    }).join("")}</ol>`;
    if (D.resp !== null) html += retornoQ();
  } else if (D.tipo === "classificar") {
    html += `<div class="linhas">${D.itens.map((it, i) => {
      const cls = it.trava ? " certa" : it.err ? " errada" : "";
      return `<div class="linha${cls}"><div class="txt">${esc(it.t)}</div>
        <div class="seg" role="group" aria-label="${esc(it.t)}">${D.E.col.map((c, j) => `<button type="button" data-it="${i}" data-col="${j}" class="${it.sel === j ? "on" : ""}" aria-pressed="${it.sel === j}" ${it.trava ? "disabled" : ""}>${esc(c)}</button>`).join("")}</div>
        ${it.trava || it.err ? `<div class="exp">${esc(it.x)}</div>` : ""}</div>`;
    }).join("")}</div>`;
    html += D.fim ? retornoEsp(true) : `<div class="botoes"><button type="button" class="btn" data-acao="conferir">Conferir</button></div><p class="instr" id="aviso-conf"></p>`;
  } else {
    const E = D.E;
    html += `<p class="instr">Toque nas peças amarelas para preencher a ordem. Toque numa vaga preenchida para tirar a peça.</p>
      <ol class="ordem">${D.seq.map((v, k) => {
        const cls = D.trava[k] ? " trava" : D.errs.includes(k) && v === null ? " errada" : v !== null ? " cheia" : "";
        return `<li><button type="button" class="vaga${cls}" data-vaga="${k}" ${D.trava[k] || D.fim ? "disabled" : ""}>${v === null ? (D.errs.includes(k) ? "Errou aqui. Qual passo vem nesta posição?" : "…") : esc(E.passos[v])}</button></li>`;
      }).join("")}</ol>
      <div class="monte">${D.monte.filter(i => !D.seq.includes(i)).map(i => `<button type="button" class="peca" data-peca="${i}" ${D.fim ? "disabled" : ""}>${esc(E.passos[i])}</button>`).join("")}</div>`;
    html += D.fim ? retornoEsp(true) : `<div class="botoes"><button type="button" class="btn" data-acao="conferir">Conferir</button></div><p class="instr" id="aviso-conf"></p>`;
  }
  abrirCamada(html, true);
}
function retornoQ() {
  const certo = D.resp === D.P.a, k = custos(FASES[S.fase]);
  return `<div class="retorno ${certo ? "ok" : "nao"}"><strong>${certo ? "Isso! Caminho liberado" : `Errou: −1 energia, +${k.erro} min`}</strong><br>${esc(D.P.x)}</div>
    <div class="botoes">${certo ? `<button type="button" class="btn sol" data-acao="liberar" data-foco>Seguir no tabuleiro</button>`
      : S.energia > 0 && !passouTempo() ? `<button type="button" class="btn" data-acao="outra" data-foco>Tentar outra pergunta</button>` : `<button type="button" class="btn" data-acao="falhou" data-foco>Continuar</button>`}</div>`;
}
function retornoEsp() {
  const x = D.tipo === "ordenar" ? D.E.x : "Tudo certo! Leia as explicações acima: elas são as regras do Enem.";
  return `<div class="retorno ok"><strong>Desafio vencido!</strong><br>${esc(x)}</div>
    <div class="botoes"><button type="button" class="btn sol" data-acao="liberar" data-foco>${D.no === "gate" ? "Concluir a fase" : "Seguir no tabuleiro"}</button></div>`;
}
const passouTempo = () => S.gasto > custos(FASES[S.fase]).W;

function errar(itens) {
  const k = custos(FASES[S.fase]);
  S.energia--; S.gasto += k.erro; S.erros++; somErro();
  [].concat(itens).forEach(t => { if (!S.revisar.includes(t)) S.revisar.push(t); });
  atualizarHud();
}
function responderQ(op) {
  if (D.resp !== null || D.elim.includes(op)) return;
  D.resp = op;
  if (op === D.P.a) { S.acertos++; somCerto(); }
  else errar(`${D.P.q} → ${D.P.o[D.P.a]}`);
  renderDesafio();
}
function conferir() {
  const aviso = document.getElementById("aviso-conf");
  if (D.tipo === "classificar") {
    if (D.itens.some(it => it.sel === null)) { aviso.textContent = "Responda todos os itens antes de conferir."; return; }
    let erradas = [];
    D.itens.forEach(it => { if (it.trava) return; if (it.sel === it.c) { it.trava = true; it.err = false; } else { it.err = true; erradas.push(it); } });
    if (!erradas.length) { D.fim = true; S.acertos++; somCerto(); }
    else { errar(erradas.map(it => `${it.t} → ${D.E.col[it.c]}. ${it.x}`)); erradas.forEach(it => it.sel = null); }
  } else {
    if (D.seq.some(v => v === null)) { aviso.textContent = "Coloque todas as peças antes de conferir."; return; }
    D.errs = [];
    D.seq.forEach((v, k) => { if (v === k) D.trava[k] = true; else D.errs.push(k); });
    if (!D.errs.length) { D.fim = true; S.acertos++; somCerto(); }
    else { errar(`${D.E.titulo}: ${D.E.passos.join(" → ")}`); D.errs.forEach(k => D.seq[k] = null); }
  }
  if (S.energia <= 0) return falhar("energia");
  if (passouTempo()) return falhar("tempo");
  renderDesafio();
}
function usarDica() {
  if (D.dica) return;
  D.dica = true; S.dicas++; S.gasto += custos(FASES[S.fase]).dica; atualizarHud();
  if (passouTempo()) return falhar("tempo");
  renderDesafio();
}
function usarProf() {
  if (!S.prof) return;
  S.prof = false;
  if (D.tipo === "q") {
    const erradas = D.P.o.map((_, i) => i).filter(i => i !== D.P.a);
    D.elim = embaralhar(erradas).slice(0, 2);
  } else if (D.tipo === "classificar") {
    embaralhar(D.itens.filter(it => !it.trava)).slice(0, 2).forEach(it => { it.sel = it.c; it.trava = true; it.err = false; });
    if (D.itens.every(it => it.trava)) { D.fim = true; S.acertos++; }
  } else {
    let n = 0;
    for (let k = 0; k < D.seq.length && n < 2; k++) {
      if (D.trava[k]) continue;
      const j = D.seq.indexOf(k); if (j >= 0 && !D.trava[j]) D.seq[j] = null;
      D.seq[k] = k; D.trava[k] = true; n++;
    }
    if (D.trava.every(Boolean)) { D.fim = true; S.acertos++; }
  }
  atualizarHud(); renderDesafio();
}
function liberar() {
  S.feitos.add(D.no);
  const era = D.no; D = null;
  if (era === "gate") return vencer();
  modo = "tabuleiro"; fecharCamada(); atualizarNos();
  const L = livres(); const g = L.length && document.getElementById("no-" + L[0]); if (g) g.focus({ preventScroll: true });
}

/* ===================== TELAS ===================== */
const camada = document.getElementById("camada"), cartao = document.getElementById("cartao");
function abrirCamada(html, manterScroll) {
  const y = camada.scrollTop;
  cartao.innerHTML = html; camada.hidden = false; camada.scrollTop = manterScroll ? y : 0;
  const f = cartao.querySelector("[data-foco]");
  if (f) setTimeout(() => f.focus({ preventScroll: true }), 30);
}
function fecharCamada() { camada.hidden = true; cartao.innerHTML = ""; }
const estrelasTxt = n => "★".repeat(n) + "☆".repeat(3 - n);

function telaMenu() {
  modo = "menu"; D = null;
  const total = salvo.estrelas.reduce((s, v) => s + (v || 0), 0);
  const atual = Math.min(salvo.liberada, FASES.length - 1);
  const botaoFase = (F, i) => {
    const bloq = i > salvo.liberada;
    return `<button type="button" class="fase${i === atual ? " atual" : ""}" data-fase="${i}" ${bloq ? "disabled" : ""}>
      <span class="n">Fase ${i + 1}</span>${esc(F.titulo)}<span class="estrelas" aria-label="${salvo.estrelas[i] || 0} estrelas">${bloq ? "🔒" : estrelasTxt(salvo.estrelas[i] || 0)}</span></button>`;
  };
  abrirCamada(`
    <p class="olho">Jogo de estratégia para os dois domingos do Enem</p>
    <h2 id="cartao-titulo">Partiu ENEM</h2>
    <p>Atravesse o tabuleiro do sábado à noite até o resultado. Em cada casa há uma pergunta ou um desafio, e só respondendo certo o caminho abre. Cuide da sua <strong>energia</strong>, do <strong>relógio</strong> e da única ajuda do <strong>professor</strong>.</p>
    <div class="botoes" style="margin-top:8px">
      <button type="button" class="btn sol" data-acao="jogar" data-foco>${salvo.liberada > 0 ? "Continuar" : "Começar"} · Fase ${atual + 1}</button>
      <button type="button" class="btn sec" data-acao="revisao">Revisão das regras</button>
    </div>
    <div class="mapa">
      <div><p class="dia-rotulo">1º domingo · Linguagens, Humanas e Redação</p><div class="fases">${FASES.map((F, i) => F.dia === 1 ? botaoFase(F, i) : "").join("")}</div></div>
      <div><p class="dia-rotulo">2º domingo · Natureza e Matemática</p><div class="fases">${FASES.map((F, i) => F.dia === 2 ? botaoFase(F, i) : "").join("")}</div></div>
    </div>
    <p class="nota-rodape">${total} de ${FASES.length * 3} estrelas. As regras seguem os editais recentes do Enem. Confira sempre o edital do ano e a Página do Participante.</p>`);
}
function telaIntro(i) {
  const F = FASES[i], k = custos(F);
  S = null; modo = "menu";
  S = { fase: i, energia: 3, gasto: 0, prof: true, pos: "ini", feitos: new Set() };
  desenharTabuleiro(); atualizarHud(); atualizarNos();
  abrirCamada(`
    <p class="olho">Dia ${F.dia} · ${esc(F.quando)} · Fase ${i + 1} de ${FASES.length}</p>
    <h2 id="cartao-titulo">${esc(F.titulo)}</h2>
    <h3>Estude antes de andar</h3>
    <ul class="regras">${F.regras.map(r => `<li>${esc(r)}</li>`).join("")}</ul>
    <h3>Seus recursos</h3>
    <div class="recursos-intro">
      <div><b>❤ Energia: 3</b>Cada erro custa 1. Sem energia, a fase recomeça.</div>
      <div><b>⏱ Relógio: ${F.inicio} → ${F.limite}</b>Passo: ${k.passo} min. Erro: +${k.erro} min. Ver regras: +${k.dica} min. Passou de ${F.limite} (${esc(F.rotLimite)}), perdeu.</div>
      <div><b>🧑‍🏫 Professor: 1 vez</b>Elimina 2 alternativas ou resolve 2 itens de um desafio. Guarde para a hora certa.</div>
      <div><b>🔀 Bifurcação</b>O atalho economiza um passo, mas traz um desafio especial no lugar de 2 perguntas.</div>
    </div>
    <div class="botoes">
      <button type="button" class="btn sol" data-acao="iniciar" data-foco>Ir para o tabuleiro</button>
      <button type="button" class="btn sec" data-acao="menu">Fases</button>
    </div>`);
}
function falhar(motivo) {
  modo = "fim"; const F = FASES[S.fase];
  const tit = motivo === "tempo" ? (S.fase === 1 ? "O portão fechou!" : "O tempo acabou!") : "Sem energia!";
  const txt = motivo === "tempo"
    ? `O relógio passou de ${F.limite} (${F.rotLimite}). Erros e consultas custam minutos: planeje melhor os passos e o atalho.`
    : "Os erros gastaram toda a sua energia. Leia o que você precisa revisar e tente de novo.";
  abrirCamada(`
    <p class="olho">Dia ${F.dia} · ${esc(F.quando)}</p>
    <h2 id="cartao-titulo">${tit}</h2>
    <p>${esc(txt)}</p>
    ${listaRevisar()}
    <div class="botoes"><button type="button" class="btn sol" data-acao="repetir" data-foco>Tentar de novo</button><button type="button" class="btn sec" data-acao="menu">Fases</button></div>`);
}
function listaRevisar() {
  if (!S.revisar.length) return "";
  return `<h3>Para revisar</h3><ul class="regras erros">${S.revisar.map(r => `<li>${esc(r)}</li>`).join("")}</ul>`;
}
function vencer() {
  modo = "fim"; const F = FASES[S.fase], k = custos(F);
  const sobra = Math.max(0, k.W - S.gasto);
  const pontos = S.acertos * 100 + S.energia * 50 + sobra + (S.prof ? 50 : 0);
  const est = S.erros === 0 ? 3 : S.erros <= 1 ? 2 : 1;
  salvo.estrelas[S.fase] = Math.max(salvo.estrelas[S.fase] || 0, est);
  salvo.pontos[S.fase] = Math.max(salvo.pontos[S.fase] || 0, pontos);
  salvo.liberada = Math.max(salvo.liberada, Math.min(FASES.length - 1, S.fase + 1));
  const ultima = S.fase === FASES.length - 1;
  if (ultima) salvo.concluiu = true;
  gravar(); somCerto();
  abrirCamada(`
    <p class="olho">Dia ${F.dia} · ${esc(F.quando)} · Fase concluída</p>
    <h2 id="cartao-titulo">${esc(F.titulo)}</h2>
    <div class="grande-estrela" aria-label="${est} de 3 estrelas">${estrelasTxt(est)}</div>
    <div class="placar"><div><b>${pontos}</b><span>pontos</span></div><div><b>${hora(minutos(F.inicio) + S.gasto)}</b><span>chegou às</span></div><div><b>${S.energia}</b><span>energia</span></div><div><b>${S.erros}</b><span>erros</span></div></div>
    <p>${S.erros === 0 ? "Sem nenhum erro! Você domina esta parte do Enem." : "Três estrelas exigem zero erros. Que tal tentar de novo?"}</p>
    <h3>Regras desta fase</h3><ul class="regras feitas">${F.regras.map(r => `<li>${esc(r)}</li>`).join("")}</ul>
    ${listaRevisar()}
    <div class="botoes">
      <button type="button" class="btn sol" data-acao="${ultima ? "certificado" : "proxima"}" data-foco>${ultima ? "Ver certificado" : "Próxima fase"}</button>
      <button type="button" class="btn sec" data-acao="repetir">Jogar de novo</button>
      <button type="button" class="btn sec" data-acao="menu">Fases</button>
    </div>`);
}
let voltaRevisao = null;
function telaRevisao() {
  if (modo === "desafio" || modo === "andando") return;
  voltaRevisao = modo === "tabuleiro" ? "tabuleiro" : "menu";
  abrirCamada(`
    <p class="olho">Tudo o que o jogo ensina, num lugar só</p>
    <h2 id="cartao-titulo">Revisão das regras</h2>
    <div class="revisao">${FASES.map((F, i) => `<section><h3>${i + 1}. ${esc(F.titulo)}</h3><ul class="regras">${F.regras.map(r => `<li>${esc(r)}</li>`).join("")}</ul></section>`).join("")}</div>
    <p class="nota-rodape">Baseado nos editais recentes do Enem (Inep). As regras podem mudar de um ano para outro: confira o edital e a Página do Participante.</p>
    <div class="botoes"><button type="button" class="btn" data-acao="fechar-revisao" data-foco>Voltar</button></div>`);
}
function telaCertificado() {
  modo = "fim";
  const total = salvo.estrelas.reduce((s, v) => s + (v || 0), 0), pts = salvo.pontos.reduce((s, v) => s + (v || 0), 0);
  abrirCamada(`
    <p class="olho">Você chegou ao fim da jornada</p>
    <h2 id="cartao-titulo">Pronto para o Enem</h2>
    <div class="campo"><label for="nome">Seu nome no certificado</label><input id="nome" maxlength="60" autocomplete="name" value="${esc(salvo.nome || "")}" placeholder="Digite seu nome"></div>
    <div class="certificado">
      <p class="olho" style="margin:0">Certificado de preparo</p>
      <p class="nome" id="cert-nome">${esc(salvo.nome || "Estudante")}</p>
      <p style="margin:0">completou o Partiu ENEM com <strong>${total} de ${FASES.length * 3} estrelas</strong> e <strong>${pts} pontos</strong>.</p>
    </div>
    <h3>Os 10 mandamentos do Enem</h3>
    <ul class="regras feitas">${MANDAMENTOS.map(m => `<li>${esc(m)}</li>`).join("")}</ul>
    <div class="botoes"><button type="button" class="btn sol" data-acao="copiar" data-foco>Copiar resultado</button><button type="button" class="btn sec" data-acao="menu">Fases</button></div>
    <p id="copiado" class="nota-rodape" aria-live="polite"></p>
    <textarea id="txt-copia" readonly hidden style="width:100%;min-height:90px;margin-top:8px;font:inherit"></textarea>`);
  const inp = document.getElementById("nome");
  inp.addEventListener("input", () => { salvo.nome = inp.value.trim(); gravar(); document.getElementById("cert-nome").textContent = salvo.nome || "Estudante"; });
}
function copiar() {
  const total = salvo.estrelas.reduce((s, v) => s + (v || 0), 0), pts = salvo.pontos.reduce((s, v) => s + (v || 0), 0);
  const t = `${salvo.nome || "Eu"} completei o Partiu ENEM: ${total}/${FASES.length * 3} estrelas e ${pts} pontos. Documento original com foto, caneta preta transparente, portão fecha às 13h. Partiu ENEM!`;
  const msg = document.getElementById("copiado"), ta = document.getElementById("txt-copia");
  const manual = () => { ta.value = t; ta.hidden = false; ta.select(); msg.textContent = "Selecione o texto acima e copie."; };
  try { navigator.clipboard.writeText(t).then(() => { msg.textContent = "Resultado copiado. Cole no grupo da turma!"; }, manual); } catch (e) { manual(); }
}

/* ===================== ENTRADAS ===================== */
cartao.addEventListener("click", ev => {
  const op = ev.target.closest("[data-op]"); if (op && !op.disabled) return responderQ(+op.dataset.op);
  const col = ev.target.closest("[data-col]");
  if (col && !col.disabled) { const it = D.itens[+col.dataset.it]; it.sel = +col.dataset.col; it.err = false; return renderDesafio(); }
  const peca = ev.target.closest("[data-peca]");
  if (peca && !peca.disabled) { const k = D.seq.indexOf(null); if (k >= 0) { D.seq[k] = +peca.dataset.peca; D.errs = D.errs.filter(e => e !== k); } return renderDesafio(); }
  const vaga = ev.target.closest("[data-vaga]");
  if (vaga && !vaga.disabled) { const k = +vaga.dataset.vaga; if (!D.trava[k]) D.seq[k] = null; return renderDesafio(); }
  const f = ev.target.closest("[data-fase]"); if (f && !f.disabled) return telaIntro(+f.dataset.fase);
  const b = ev.target.closest("[data-acao]"); if (!b || b.disabled) return;
  const a = b.dataset.acao;
  if (a === "jogar") telaIntro(Math.min(salvo.liberada, FASES.length - 1));
  else if (a === "revisao") telaRevisao();
  else if (a === "iniciar" || a === "repetir") iniciarFase(S ? S.fase : 0);
  else if (a === "proxima") telaIntro(S.fase + 1);
  else if (a === "menu") telaMenu();
  else if (a === "evento-ok") { const d = eventoDepois; eventoDepois = null; if (d) d(); }
  else if (a === "dica") usarDica();
  else if (a === "prof") usarProf();
  else if (a === "conferir") conferir();
  else if (a === "liberar") liberar();
  else if (a === "outra") abrirDesafio(D.no);
  else if (a === "falhou") falhar(S.energia <= 0 ? "energia" : "tempo");
  else if (a === "certificado") telaCertificado();
  else if (a === "copiar") copiar();
  else if (a === "fechar-revisao") { if (voltaRevisao === "tabuleiro") { modo = "tabuleiro"; fecharCamada(); atualizarNos(); } else telaMenu(); }
});
cartao.addEventListener("keydown", ev => {
  if (D && D.tipo === "q" && D.resp === null) {
    const k = "abcd".indexOf(ev.key.toLowerCase()), n = "1234".indexOf(ev.key), i = k >= 0 ? k : n;
    if (i >= 0 && i < D.P.o.length) { ev.preventDefault(); responderQ(i); }
  }
});
elTab.addEventListener("click", ev => { const g = ev.target.closest("[data-no]"); if (g) ir(g.dataset.no); });
elTab.addEventListener("keydown", ev => { if ((ev.key === "Enter" || ev.key === " ") && ev.target.dataset && ev.target.dataset.no) { ev.preventDefault(); ir(ev.target.dataset.no); } });
document.getElementById("escolhas").addEventListener("click", ev => { const b = ev.target.closest("[data-ir]"); if (b) ir(b.dataset.ir); });

const bSom = document.getElementById("b-som");
function rotuloSom() { bSom.textContent = "Som: " + (salvo.som ? "ligado" : "desligado"); bSom.setAttribute("aria-pressed", String(!!salvo.som)); }
bSom.addEventListener("click", () => { salvo.som = !salvo.som; gravar(); rotuloSom(); });
document.getElementById("b-revisao").addEventListener("click", telaRevisao);
document.getElementById("b-menu").addEventListener("click", () => { if (modo !== "andando") telaMenu(); });

let tRes = null, oriAntes = null;
window.addEventListener("resize", () => {
  clearTimeout(tRes);
  tRes = setTimeout(() => { const o = elTab.clientWidth < 640 ? "P" : "L"; if (o !== oriAntes) { oriAntes = o; desenharTabuleiro(); } }, 150);
});

/* ===================== INÍCIO ===================== */
if (salvo.som === undefined) salvo.som = true;
rotuloSom();
S = { fase: Math.min(salvo.liberada, FASES.length - 1), energia: 3, gasto: 0, prof: true, pos: "ini", feitos: new Set() };
desenharTabuleiro(); oriAntes = ori; atualizarHud();
telaMenu();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (modo !== "andando") desenharTabuleiro(); });
})();
</script>
