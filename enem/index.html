<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1c2046">
<title>Partiu ENEM</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Partiu ENEM: jogo de corrida para treinar, brincando, todas as regras e cuidados dos dois dias do Enem.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: uma tela de jogo (canvas 2:1) com cartões no estilo Cartão-Resposta por cima */
:root {
  --noite: #1c2046;        /* fundo da página */
  --noite-2: #282d5c;
  --papel: #fbf6ea;        /* papel do cartão-resposta */
  --salmao: #e7695d;       /* linhas salmão do cartão */
  --salmao-claro: #f6cdc6;
  --sol: #ffc83d;          /* destaque */
  --tinta: #191c2e;        /* tinta preta da caneta */
  --mato: #2a9d8f;         /* acerto */
  --erro: #d64545;
  --texto-claro: #eef0ff;
  --texto-suave: #b9bde6;
  --f-display: "Bungee", "Arial Black", Impact, sans-serif;
  --f-corpo: "Atkinson Hyperlegible", "Segoe UI", Roboto, Arial, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  background: var(--noite);
  color: var(--texto-claro);
  font-family: var(--f-corpo);
  font-size: 16px;
  -webkit-tap-highlight-color: transparent;
}
#app {
  min-height: 100%;
  display: flex; flex-direction: column; gap: 10px;
  max-width: 1100px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px 16px;
  box-sizing: border-box;
}
.topo { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.marca { font-family: var(--f-display); font-size: 1.35rem; letter-spacing: .02em; margin: 0; color: var(--sol); line-height: 1; }
.marca span { color: var(--texto-claro); }
.topo .acoes { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.btn-mini {
  font: 700 .85rem var(--f-corpo); color: var(--texto-claro);
  background: var(--noite-2); border: 1px solid #3d4384; border-radius: 999px;
  padding: 7px 13px; cursor: pointer;
}
.btn-mini:hover { border-color: var(--sol); }
button:focus-visible, input:focus-visible { outline: 3px solid var(--sol); outline-offset: 2px; }

#palco {
  position: relative; width: 100%;
  aspect-ratio: 2 / 1; max-width: 100%;
  max-height: calc(100vh - 150px); min-height: 180px;
  margin: 0 auto;
  border-radius: 14px; overflow: hidden;
  background: #7fd3f0;
  box-shadow: 0 0 0 3px #0f1230, 0 14px 40px rgba(0,0,0,.35);
  touch-action: manipulation; user-select: none; -webkit-user-select: none;
  cursor: pointer;
}
#cv { display: block; width: 100%; height: 100%; }
#aviso {
  position: absolute; left: 50%; top: 13%; transform: translateX(-50%);
  width: min(88%, 560px); box-sizing: border-box;
  padding: 10px 14px; border-radius: 12px;
  font: 700 clamp(.78rem, 1.9vw, 1rem)/1.3 var(--f-corpo);
  background: var(--papel); color: var(--tinta);
  border-left: 8px solid var(--mato);
  box-shadow: 0 6px 18px rgba(0,0,0,.25);
  pointer-events: none; transition: opacity .25s;
}
#aviso.ruim { border-left-color: var(--erro); }
#aviso b { font-family: var(--f-display); font-weight: 400; letter-spacing: .02em; }
.ajuda { margin: 0; color: var(--texto-suave); font-size: .9rem; text-align: center; }
.ajuda kbd { font: 700 .8rem var(--f-corpo); background: var(--noite-2); border: 1px solid #3d4384; border-radius: 6px; padding: 1px 6px; color: var(--texto-claro); }

/* Cartões (sobrepostos) */
#camada {
  position: fixed; inset: 0; z-index: 20;
  display: flex; align-items: flex-start; justify-content: center;
  overflow-y: auto; background: rgba(15, 17, 44, .72);
  padding: calc(env(safe-area-inset-top, 0px) + 16px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 16px) max(16px, env(safe-area-inset-left, 0px));
  box-sizing: border-box;
}
.cartao {
  position: relative; margin: auto 0;
  width: 100%; max-width: 640px; box-sizing: border-box;
  background: var(--papel); color: var(--tinta);
  border-radius: 6px;
  padding: 26px 26px 22px 40px;
  box-shadow: 0 20px 60px rgba(0,0,0,.45);
  /* margem salmão, como no cartão-resposta */
  background-image: linear-gradient(90deg, transparent 22px, var(--salmao) 22px, var(--salmao) 24px, transparent 24px);
}
.cartao::before {
  content: ""; position: absolute; top: 0; left: 0; right: 0; height: 8px;
  background: repeating-linear-gradient(90deg, var(--tinta) 0 10px, transparent 10px 18px);
  opacity: .85; border-radius: 6px 6px 0 0;
}
.olho { font: 700 .74rem var(--f-corpo); letter-spacing: .12em; text-transform: uppercase; color: var(--salmao); margin: 0 0 6px; }
.cartao h2 { font-family: var(--f-display); font-weight: 400; font-size: clamp(1.35rem, 4.4vw, 1.9rem); line-height: 1.1; margin: 0 0 12px; text-wrap: balance; }
.cartao h3 { font-family: var(--f-display); font-weight: 400; font-size: 1rem; margin: 18px 0 8px; letter-spacing: .02em; }
.cartao p { line-height: 1.5; margin: 0 0 10px; }
.cartao ul.regras { margin: 0 0 6px; padding: 0; list-style: none; display: grid; gap: 7px; }
.cartao ul.regras li { position: relative; padding-left: 26px; line-height: 1.42; }
.cartao ul.regras li::before {
  content: ""; position: absolute; left: 2px; top: .28em; width: 13px; height: 13px;
  border-radius: 50%; border: 2px solid var(--salmao); box-sizing: border-box;
}
.cartao ul.regras.feitas li::before { background: var(--tinta); border-color: var(--tinta); }
.cartao ul.regras.erros li::before { border-color: var(--erro); background: var(--erro); }
.botoes { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
.btn {
  font: 400 1rem var(--f-display); letter-spacing: .03em;
  border: 0; border-radius: 10px; padding: 13px 20px; cursor: pointer;
  background: var(--tinta); color: var(--papel);
  box-shadow: 0 4px 0 #000;
}
.btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #000; }
.btn.sec { background: transparent; color: var(--tinta); box-shadow: inset 0 0 0 2px var(--tinta); }
.btn.sol { background: var(--sol); color: var(--tinta); box-shadow: 0 4px 0 #b88a10; }

/* Menu: mapa de fases */
.mapa { display: grid; gap: 14px; margin: 16px 0 4px; }
.dia-rotulo { font: 700 .78rem var(--f-corpo); letter-spacing: .1em; text-transform: uppercase; margin: 0 0 6px; color: #5b5f7a; }
.fases { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
.fase {
  text-align: left; cursor: pointer;
  font: 700 .86rem/1.25 var(--f-corpo); color: var(--tinta);
  background: #fff; border: 2px solid var(--tinta); border-radius: 10px;
  padding: 8px 10px; min-height: 74px;
  display: flex; flex-direction: column; gap: 4px;
}
.fase .n { font-family: var(--f-display); font-weight: 400; font-size: .8rem; color: var(--salmao); }
.fase .estrelas { margin-top: auto; letter-spacing: 2px; font-size: .85rem; color: #c9a227; }
.fase[disabled] { opacity: .45; cursor: not-allowed; border-style: dashed; }
.fase.atual { background: var(--sol); }
.nota-rodape { font-size: .82rem; color: #5b5f7a; margin-top: 14px !important; }

/* Questões no estilo cartão-resposta */
.opcoes { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 8px; }
.opcao {
  width: 100%; text-align: left; cursor: pointer;
  display: flex; gap: 12px; align-items: flex-start;
  font: 400 1rem/1.4 var(--f-corpo); color: var(--tinta);
  background: #fff; border: 2px solid #d9d2c0; border-radius: 10px; padding: 10px 12px;
}
.opcao:hover:not([disabled]) { border-color: var(--tinta); }
.bolha {
  flex: none; width: 28px; height: 28px; border-radius: 50%;
  border: 2px solid var(--salmao); color: var(--salmao);
  display: grid; place-items: center;
  font: 700 .85rem var(--f-corpo);
}
.opcao.marcada .bolha { background: var(--tinta); border-color: var(--tinta); color: var(--tinta); }
.opcao.certa { border-color: var(--mato); background: #e3f4f1; }
.opcao.certa .bolha { border-color: var(--mato); }
.opcao.errada { border-color: var(--erro); background: #fbe5e3; }
.opcao[disabled] { cursor: default; }
.retorno { margin-top: 14px; padding: 12px 14px; border-radius: 10px; line-height: 1.45; }
.retorno.ok { background: #e3f4f1; }
.retorno.nao { background: #fbe5e3; }
.retorno strong { font-family: var(--f-display); font-weight: 400; letter-spacing: .02em; }

.placar { display: flex; gap: 18px; flex-wrap: wrap; margin: 4px 0 6px; }
.placar div { display: flex; flex-direction: column; }
.placar b { font: 400 1.6rem var(--f-display); font-variant-numeric: tabular-nums; }
.placar span { font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; color: #5b5f7a; }
.grande-estrela { font-size: 2rem; letter-spacing: 6px; color: #c9a227; margin: 2px 0 8px; }

.revisao section { border-top: 2px dashed var(--salmao-claro); padding-top: 4px; }
.campo { display: grid; gap: 6px; margin: 12px 0; }
.campo label { font-weight: 700; font-size: .9rem; }
.campo input {
  font: 400 1.05rem var(--f-corpo); padding: 10px 12px; border-radius: 8px;
  border: 2px solid var(--tinta); background: #fff; color: var(--tinta);
}
.certificado {
  border: 3px double var(--tinta); border-radius: 8px; padding: 16px; margin: 10px 0;
  text-align: center; background: #fff;
}
.certificado .nome { font: 400 clamp(1.2rem, 4vw, 1.7rem) var(--f-display); margin: 6px 0; overflow-wrap: anywhere; }
@media (max-width: 640px) {
  #palco { aspect-ratio: 7 / 6; max-height: calc(100vh - 170px); }
}
@media (max-width: 520px) {
  .cartao { padding: 22px 16px 18px 34px; background-image: linear-gradient(90deg, transparent 16px, var(--salmao) 16px, var(--salmao) 18px, transparent 18px); }
  #palco { border-radius: 10px; }
}
@media (prefers-reduced-motion: reduce) { #aviso { transition: none; } }
</style>
</head>

/* ===================== SOM ===================== */
let ac = null;
function bip(f, d = .09, tipo = "square", vol = .05) {
  if (!salvo.som) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = tipo; o.frequency.value = f;
    g.gain.setValueAtTime(vol, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + d);
    o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + d);
  } catch (e) {}
}

  const r = palco.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2);

function h(n) { const x = Math.sin(n * 127.1 + 11.7) * 43758.5453; return x - Math.floor(x); }

    for (let i = -1; i < 5; i++) {

function predios(off, cor, hmin, hmax, larg, jan, alfa, arvores) {

/* ===================== PERSONAGEM ===================== */
function desenharJogador(p, t) {
  const x = p.x, y = p.y; // y = topo
  if (p.invul > 0 && Math.floor(p.invul * 14) % 2) return;
  ctx.fillStyle = "rgba(0,0,0,.22)";
  const sombra = Math.max(.4, 1 - (CHAO - (y + p.h)) / 220);
  ctx.beginPath(); ctx.ellipse(x + p.w / 2, CHAO + 4, 22 * sombra, 6 * sombra, 0, 0, 7); ctx.fill();
  const corre = p.chao ? Math.sin(t * 20) : .6;
  // pernas
  ctx.strokeStyle = "#1f3b73"; ctx.lineWidth = 9; ctx.lineCap = "round";
  const qx = x + p.w / 2, qy = y + 44;
  ctx.beginPath(); ctx.moveTo(qx, qy); ctx.lineTo(qx + corre * 12, qy + 18); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(qx, qy); ctx.lineTo(qx - corre * 12, qy + 18); ctx.stroke();
  ctx.fillStyle = "#111"; ctx.fillRect(qx + corre * 12 - 5, qy + 17, 12, 5); ctx.fillRect(qx - corre * 12 - 5, qy + 17, 12, 5);
  // mochila
  ctx.fillStyle = "#e7695d"; roundRect(x - 4, y + 18, 16, 26, 5); ctx.fill();
  // corpo (farda)
  ctx.fillStyle = "#ffffff"; roundRect(x + 6, y + 18, 26, 30, 7); ctx.fill();
  ctx.fillStyle = "#2a9d8f"; ctx.fillRect(x + 6, y + 30, 26, 5);
  // braço
  ctx.strokeStyle = "#8d5a3b"; ctx.lineWidth = 7;
  ctx.beginPath(); ctx.moveTo(x + 20, y + 24); ctx.lineTo(x + 20 - corre * 10, y + 40); ctx.stroke();
  // cabeça
  ctx.fillStyle = "#8d5a3b"; ctx.beginPath(); ctx.arc(x + 21, y + 9, 12, 0, 7); ctx.fill();
  ctx.fillStyle = "#1b1b1b"; ctx.beginPath(); ctx.arc(x + 19, y + 4, 12, Math.PI * 1.02, Math.PI * 2.05); ctx.fill();
  ctx.beginPath(); ctx.arc(x + 10, y + 8, 5, 0, 7); ctx.fill();
  ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(x + 27, y + 9, 3, 0, 7); ctx.fill();
  ctx.fillStyle = "#111"; ctx.beginPath(); ctx.arc(x + 28, y + 9, 1.6, 0, 7); ctx.fill();
}
function roundRect(x, y, w, hh, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + hh, r); ctx.arcTo(x + w, y + hh, x, y + hh, r);
  ctx.arcTo(x, y + hh, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

/* ===================== JOGO ===================== */
const G = 2500, PULO = -860, PULO2 = -720;
let estado = "menu", faseIdx = 0, J, ents, tempo, dist, vel, proxSpawn, vidas, pontos, acertos, nPerg, aprendidos, erros, pegos, perguntasFase, gatesFeitos, cenaAtual = "manha", tGlobal = 0, offMenu = 0;
const DURACAO = 46;

function novoJogador() { return { x: W < 700 ? 96 : 150, y: CHAO - 66, w: 38, h: 66, vy: 0, chao: true, pulos: 0, invul: 0 }; }

function iniciarFase(i) {
  faseIdx = i; const F = FASES[i];
  cenaAtual = F.cena; J = novoJogador(); ents = [];
  tempo = 0; dist = 0; vel = 330; proxSpawn = 1.2; vidas = 3; pontos = 0; acertos = 0; nPerg = 0;
  aprendidos = new Map(); erros = new Map(); pegos = new Set(); gatesFeitos = 0;
  perguntasFase = embaralhar(F.perguntas.slice()).slice(0, 3);
  agenda = [];
  // itens obrigatórios garantidos
  (F.obrig || []).forEach((grupo, k) => { agenda.push({ t: 5 + k * 6, item: grupo[0], alt: "chao" }); agenda.push({ t: 27 + k * 5, item: grupo[0], alt: "meio", seFalta: grupo }); });

}
let agenda = [];
function embaralhar(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function pular() {
  if (estado !== "jogo") return;
  if (J.chao) { J.vy = PULO; J.chao = false; J.pulos = 1; somPulo(); }
  else if (J.pulos < 2) { J.vy = PULO2; J.pulos = 2; somPulo(); }
}
function soltar() { if (estado === "jogo" && J.vy < -340) J.vy = -340; }

function criarItem(chave, alt) {
  const y = alt === "chao" ? CHAO - 30 : alt === "meio" ? CHAO - 126 : CHAO - 206;
  ents.push({ tipo: "item", k: chave, x: W + 40, y, r: 24, bob: Math.random() * 6 });
}
function criarObst() {
  const F = FASES[faseIdx], alto = 38 + Math.random() * 22, larg = 46 + Math.random() * 20;
  ents.push({ tipo: "obst", x: W + 40, y: CHAO - alto, w: larg, h: alto, rot: sortear(F.obst) });
}
function spawnAleatorio() {
  const F = FASES[faseIdx], r = Math.random();
  if (r < .3) return criarObst();
  const bom = Math.random() < .55;
  const k = bom ? sortear(F.bons) : sortear(F.ruins);
  if (IT[k].heal && (vidas >= 3 || Math.random() < .5)) return criarItem(sortear(F.bons.filter(b => !IT[b].heal)), "meio");
  let alt;
  if (bom) alt = sortear(["chao", "meio", "meio", "alto"]);

let ultimoTs = 0;
function quadro(ts) {
  const dt = Math.min(.033, (ts - ultimoTs) / 1000 || 0); ultimoTs = ts; tGlobal += dt;
  if (estado === "jogo") atualizar(dt);
  else { offMenu += dt * 60; }
  desenhar();
  requestAnimationFrame(quadro);
}

function atualizar(dt) {
  tempo += dt; vel = 330 + Math.min(110, tempo * 2.4); dist += vel * dt;
  // física
  J.vy += G * dt; J.y += J.vy * dt;
  if (J.y + J.h >= CHAO) { J.y = CHAO - J.h; J.vy = 0; J.chao = true; J.pulos = 0; }
  if (J.invul > 0) J.invul -= dt;
  // agenda
  while (agenda.length && agenda[0].t <= tempo) {
    const a = agenda.shift();
    if (a.gate) ents.push({ tipo: "gate", x: W + 60, y: CHAO - 190, w: 70, h: 190 });
    else if (a.fim) ents.push({ tipo: "fim", x: W + 60, y: CHAO - 210, w: 24, h: 210 });
    else if (a.item) { if (!a.seFalta || !a.seFalta.some(k => pegos.has(k))) criarItem(a.item, a.alt); }
    proxSpawn = Math.max(proxSpawn, tempo + .9);

    if (e.tipo === "item") {

      if (cx > J.x - 18 && cx < J.x + J.w + 18 && cy > J.y - 16 && cy < J.y + J.h + 16) { e.morto = true; pegar(e.k); }
    } else if (e.tipo === "obst") {

    } else if (e.tipo === "gate") {

    } else if (e.tipo === "fim") {
      if (e.x <= J.x + J.w) { e.morto = true; terminarFase(); return; }
    }

function pegar(k) {
  const it = IT[k];
  if (it.good) {

    if (it.heal) vidas = Math.min(5, vidas + 1);

}

  else avisar(`<b>${rotulo}</b> — pule por cima dos obstáculos!`, true, 1600);

/* ===================== DESENHO ===================== */
function relogioAtual() {
  const F = FASES[faseIdx], [a, b] = F.relogio;
  const p = Math.min(1, tempo / DURACAO);
  if (!/^\d/.test(a) || !/^\d/.test(b)) {
    if (a === "Seg") return ["Seg", "Ter", "Qua", "Qui", "Sex", "Sáb"][Math.min(5, Math.floor(p * 6))];
    return p < .5 ? "18:30" : "Depois";
  }
  const m = s => { const [hh, mm] = s.split(":").map(Number); return hh * 60 + mm; };
  const v = Math.round(m(a) + (m(b) - m(a)) * p);
  return String(Math.floor(v / 60)).padStart(2, "0") + ":" + String(v % 60).padStart(2, "0");
}

function desenhar() {
  const emJogo = estado === "jogo" || estado === "pergunta" || estado === "pausa" || estado === "fimDeJogo";
  const off = emJogo ? dist : offMenu * 3;
  fundo(cenaAtual, off, tGlobal);
  if (!emJogo) { desenharJogador({ x: W < 700 ? 96 : 150, y: CHAO - 66, w: 38, h: 66, chao: true, invul: 0 }, tGlobal); return; }

    else if (e.tipo === "gate") desenharGate(e);

      <div><p class="dia-rotulo">2º domingo · Natureza e Matemática</p><div class="fases">${FASES.map((F, i) => F.dia === 2 ? botaoFase(F, i) : "").join("")}</div></div>
    </div>
    <p class="nota-rodape">${total} de ${FASES.length * 3} estrelas. As regras seguem os editais recentes do Enem. Confira sempre o edital do ano e a Página do Participante.</p>`);
}

function telaIntro(i) {
  const F = FASES[i]; estado = "intro"; faseIdx = i; cenaAtual = F.cena; limparAviso();
  abrirCamada(`
    <p class="olho">${esc(quandoTxt(F))} · Fase ${i + 1} de ${FASES.length}</p>
    <h2 id="cartao-titulo">${esc(F.titulo)}</h2>
    <h3>Fique ligado</h3>
    <ul class="regras">${F.regras.map(r => `<li>${esc(r)}</li>`).join("")}</ul>
    ${F.obrig ? `<p style="margin-top:10px"><strong>Para passar:</strong> pegue o documento e a caneta antes da chegada.</p>` : ""}
    <div class="botoes">
      <button type="button" class="btn sol" data-acao="iniciar" data-foco>Correr</button>
      <button type="button" class="btn sec" data-acao="menu">Fases</button>
    </div>`);
}

let pergAtual = null;
function abrirPergunta() {
  estado = "pergunta"; limparAviso();
  pergAtual = perguntasFase[gatesFeitos] || sortear(FASES[faseIdx].perguntas);
  nPerg++;
  const P = pergAtual;
  abrirCamada(`
    <p class="olho">Questão ${gatesFeitos + 1} de 3 · Fase ${faseIdx + 1}</p>
    <h2 id="cartao-titulo" style="font-family:var(--f-corpo);font-weight:700;font-size:clamp(1.15rem,3.6vw,1.45rem);line-height:1.3">${esc(P.q)}</h2>
    <ol class="opcoes">${P.o.map((o, k) => `<li><button type="button" class="opcao" data-op="${k}" ${k === 0 ? "data-foco" : ""}><span class="bolha">${"ABCDE"[k]}</span><span>${esc(o)}</span></button></li>`).join("")}</ol>
    <div id="retorno"></div>`);
}
function responder(k) {
  const P = pergAtual; if (!P || cartao.querySelector(".opcao[disabled]")) return;
  const certo = k === P.a;
  cartao.querySelectorAll(".opcao").forEach((b, i) => {
    b.disabled = true;
    if (i === k) b.classList.add("marcada");
    if (i === P.a) b.classList.add("certa");
    else if (i === k) b.classList.add("errada");
  });
  if (certo) { acertos++; pontos += 50; somCerto(); }
  else { vidas = Math.max(1, vidas - 1); somRuim(); erros.set("q" + nPerg, `${P.q} → ${P.o[P.a]}`); }
  const ret = document.getElementById("retorno");
  ret.innerHTML = `<div class="retorno ${certo ? "ok" : "nao"}"><strong>${certo ? "Isso! +50" : "Quase. −1 vida"}</strong><br>${esc(P.x)}</div>
    <div class="botoes"><button type="button" class="btn" data-acao="seguir">Seguir correndo</button></div>`;
  ret.querySelector("button").focus({ preventScroll: true });
}
function seguir() { gatesFeitos++; pergAtual = null; fecharCamada(); estado = "jogo"; ultimoTs = performance.now(); }

function terminarFase() {
  const F = FASES[faseIdx];
  const faltando = (F.obrig || []).filter(g => !g.some(k => pegos.has(k)));
  limparAviso();
  if (faltando.length) {
    estado = "resultado";
    abrirCamada(`
      <p class="olho">${esc(quandoTxt(F))}</p>
      <h2 id="cartao-titulo">Barrado no portão!</h2>
      <ul class="regras erros">${faltando.map(g => `<li>${esc(F.msgObrig[g[0]])}</li>`).join("")}</ul>
      <p style="margin-top:10px">Esses dois itens são obrigatórios. Tente de novo e pegue os dois.</p>
      <div class="botoes"><button type="button" class="btn sol" data-acao="repetir" data-foco>Tentar de novo</button><button type="button" class="btn sec" data-acao="menu">Fases</button></div>`);
    return;
  }
  pontos += vidas * 20;
  const est = acertos === 3 && vidas >= 2 ? 3 : acertos >= 2 ? 2 : 1;
  salvo.estrelas[faseIdx] = Math.max(salvo.estrelas[faseIdx] || 0, est);
  salvo.pontos[faseIdx] = Math.max(salvo.pontos[faseIdx] || 0, pontos);
  salvo.liberada = Math.max(salvo.liberada, Math.min(FASES.length - 1, faseIdx + 1));
  const ultima = faseIdx === FASES.length - 1;
  if (ultima) salvo.concluiu = true;
  gravar();
  estado = "resultado"; somCerto();
  abrirCamada(`
    <p class="olho">${esc(quandoTxt(F))} · Fase concluída</p>
    <h2 id="cartao-titulo">${esc(F.titulo)}</h2>
    <div class="grande-estrela" aria-label="${est} de 3 estrelas">${estrelasTxt(est)}</div>
    <div class="placar"><div><b>${pontos}</b><span>pontos</span></div><div><b>${acertos}/3</b><span>questões</span></div><div><b>${vidas}</b><span>vidas</span></div></div>
    ${listaAprendidos()}${listaErros()}
    <div class="botoes">
      <button type="button" class="btn sol" data-acao="${ultima ? "certificado" : "proxima"}" data-foco>${ultima ? "Ver certificado" : "Próxima fase"}</button>
      <button type="button" class="btn sec" data-acao="repetir">Jogar de novo</button>
      <button type="button" class="btn sec" data-acao="menu">Fases</button>
    </div>`);
}
function listaAprendidos() {
  if (!aprendidos.size) return "";
  return `<h3>Você levou certo</h3><ul class="regras feitas">${[...aprendidos].map(([k, m]) => `<li><strong>${esc(IT[k].l)}:</strong> ${esc(m)}</li>`).join("")}</ul>`;
}
function listaErros() {
  if (!erros.size) return "";
  return `<h3>Para revisar</h3><ul class="regras erros">${[...erros].map(([k, m]) => `<li>${IT[k] ? `<strong>${esc(IT[k].l)}:</strong> ` : ""}${esc(m)}</li>`).join("")}</ul>`;
}
function telaDerrota() {
  const F = FASES[faseIdx]; estado = "resultado"; limparAviso();
  abrirCamada(`
    <p class="olho">${esc(quandoTxt(F))}</p>
    <h2 id="cartao-titulo">Acabaram as vidas</h2>
    <p>Sem problema: é para isso que serve o treino. Leia o que derrubou você e tente de novo.</p>
    ${listaErros()}
    <div class="botoes"><button type="button" class="btn sol" data-acao="repetir" data-foco>Tentar de novo</button><button type="button" class="btn sec" data-acao="menu">Fases</button></div>`);
}

function telaRevisao() {
  if (estado === "pergunta") return;
  const anterior = estado; if (estado === "jogo") estado = "pausa";
  revisaoVolta = anterior;
  abrirCamada(`
    <p class="olho">Tudo o que o jogo ensina, num lugar só</p>
    <h2 id="cartao-titulo">Revisão das regras</h2>
    <div class="revisao">
      ${FASES.map((F, i) => `<section><h3>${i + 1}. ${esc(F.titulo)}</h3><ul class="regras">${F.regras.map(r => `<li>${esc(r)}</li>`).join("")}</ul></section>`).join("")}
    </div>
    <p class="nota-rodape">Baseado nos editais recentes do Enem (Inep). Regras podem mudar de um ano para outro: confira o edital e a Página do Participante.</p>
    <div class="botoes"><button type="button" class="btn" data-acao="fechar-revisao" data-foco>${anterior === "jogo" ? "Voltar ao jogo" : "Voltar"}</button></div>`);
}
let revisaoVolta = "menu";

function telaCertificado() {
  estado = "resultado";
  const total = salvo.estrelas.reduce((s, v) => s + (v || 0), 0), pts = salvo.pontos.reduce((s, v) => s + (v || 0), 0);
  abrirCamada(`
    <p class="olho">Você chegou ao fim da jornada</p>
    <h2 id="cartao-titulo">Pronto para o Enem</h2>
    <div class="campo"><label for="nome">Seu nome no certificado</label><input id="nome" maxlength="60" autocomplete="name" value="${esc(salvo.nome || "")}" placeholder="Digite seu nome"></div>
    <div class="certificado">
      <p class="olho" style="margin:0">Certificado de preparo</p>
      <p class="nome" id="cert-nome">${esc(salvo.nome || "Estudante")}</p>
      <p style="margin:0">completou o Partiu ENEM com <strong>${total} de ${FASES.length * 3} estrelas</strong> e <strong>${pts} pontos</strong>.</p>
    </div>
    <h3>Os 10 mandamentos do Enem</h3>
    <ul class="regras feitas">${MANDAMENTOS.map(m => `<li>${esc(m)}</li>`).join("")}</ul>
    <div class="botoes">
      <button type="button" class="btn sol" data-acao="copiar" data-foco>Copiar resultado</button>
      <button type="button" class="btn sec" data-acao="menu">Fases</button>
    </div>
    <p id="copiado" class="nota-rodape" aria-live="polite"></p>
    <textarea id="txt-copia" readonly hidden style="width:100%;min-height:90px;margin-top:8px;font:inherit"></textarea>`);
  const inp = document.getElementById("nome");
  inp.addEventListener("input", () => { salvo.nome = inp.value.trim(); gravar(); document.getElementById("cert-nome").textContent = salvo.nome || "Estudante"; });
}
function textoResultado() {
  const total = salvo.estrelas.reduce((s, v) => s + (v || 0), 0), pts = salvo.pontos.reduce((s, v) => s + (v || 0), 0);
  return `${salvo.nome || "Eu"} completei o Partiu ENEM: ${total}/${FASES.length * 3} estrelas e ${pts} pontos. Documento original com foto, caneta preta transparente, portão fecha às 13h. Partiu ENEM!`;
}
function copiar() {
  const t = textoResultado(), msg = document.getElementById("copiado"), ta = document.getElementById("txt-copia");
  const mostrar = () => { ta.value = t; ta.hidden = false; ta.select(); msg.textContent = "Selecione o texto acima e copie."; };
  try { navigator.clipboard.writeText(t).then(() => { msg.textContent = "Resultado copiado. Cole no grupo da turma!"; }, mostrar); } catch (e) { mostrar(); }
}

/* ===================== ENTRADAS ===================== */
cartao.addEventListener("click", ev => {
  const op = ev.target.closest("[data-op]"); if (op) return responder(+op.dataset.op);
  const f = ev.target.closest("[data-fase]"); if (f && !f.disabled) return telaIntro(+f.dataset.fase);
  const b = ev.target.closest("[data-acao]"); if (!b) return;
  const a = b.dataset.acao;
  if (a === "jogar") telaIntro(Math.min(salvo.liberada, FASES.length - 1));
  else if (a === "revisao") telaRevisao();
  else if (a === "iniciar" || a === "repetir") iniciarFase(faseIdx);
  else if (a === "proxima") telaIntro(faseIdx + 1);
  else if (a === "menu") telaMenu();
  else if (a === "seguir") seguir();
  else if (a === "certificado") telaCertificado();
  else if (a === "copiar") copiar();
  else if (a === "continuar") retomar();
  else if (a === "fechar-revisao") { if (revisaoVolta === "jogo") retomar(); else if (revisaoVolta === "menu") telaMenu(); else telaMenu(); }
});
cartao.addEventListener("keydown", ev => {
  if (estado === "pergunta" && !cartao.querySelector(".opcao[disabled]")) {
    const i = "abcde".indexOf(ev.key.toLowerCase()), n = "12345".indexOf(ev.key);
    const k = i >= 0 ? i : n;
    if (k >= 0 && k < pergAtual.o.length) { ev.preventDefault(); responder(k); }
  }
});

function pausar() {
  if (estado !== "jogo") return;
  estado = "pausa"; limparAviso();
  abrirCamada(`<p class="olho">Fase ${faseIdx + 1} · ${esc(FASES[faseIdx].titulo)}</p><h2 id="cartao-titulo">Pausado</h2>
    <div class="botoes"><button type="button" class="btn sol" data-acao="continuar" data-foco>Continuar</button><button type="button" class="btn sec" data-acao="repetir">Recomeçar fase</button><button type="button" class="btn sec" data-acao="menu">Fases</button></div>`);
}
function retomar() { fecharCamada(); estado = "jogo"; ultimoTs = performance.now(); }

document.addEventListener("keydown", ev => {
  if (ev.target.tagName === "INPUT" || ev.target.tagName === "TEXTAREA") return;
  if (estado === "jogo") {
    if (ev.code === "Space" || ev.code === "ArrowUp" || ev.code === "KeyW") { ev.preventDefault(); if (!ev.repeat) pular(); }
    else if (ev.code === "KeyP" || ev.code === "Escape") pausar();
  } else if (estado === "pausa" && (ev.code === "KeyP" || ev.code === "Escape") && camada.querySelector("[data-acao=continuar]")) retomar();
});
document.addEventListener("keyup", ev => { if (ev.code === "Space" || ev.code === "ArrowUp" || ev.code === "KeyW") soltar(); });
palco.addEventListener("pointerdown", ev => {
  ev.preventDefault();
  if (estado === "jogo") pular();
  else if (estado === "menu" && camada.hidden) telaMenu();
});
palco.addEventListener("pointerup", soltar);
palco.addEventListener("pointercancel", soltar);
document.addEventListener("visibilitychange", () => { if (document.hidden) pausar(); });

const bSom = document.getElementById("b-som");
function rotuloSom() { bSom.textContent = "Som: " + (salvo.som ? "ligado" : "desligado"); bSom.setAttribute("aria-pressed", String(!!salvo.som)); }
bSom.addEventListener("click", () => { salvo.som = !salvo.som; gravar(); rotuloSom(); });
document.getElementById("b-pausa").addEventListener("click", () => { if (estado === "jogo") pausar(); else if (estado === "pausa") retomar(); });
document.getElementById("b-revisao").addEventListener("click", telaRevisao);
document.getElementById("b-menu").addEventListener("click", telaMenu);

/* ===================== INÍCIO ===================== */
if (salvo.som === undefined) salvo.som = true;
rotuloSom(); ajustar();
telaMenu();
requestAnimationFrame(t => { ultimoTs = t; requestAnimationFrame(quadro); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(ajustar);
})();
</script>

</body>
</html>
